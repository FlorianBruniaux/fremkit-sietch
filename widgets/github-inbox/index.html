<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>GitHub inbox</title>
<style>
  html,body{margin:0;height:100%;background:transparent;color:var(--text, #e6e8eb);font-family:var(--font, -apple-system,system-ui,sans-serif);overflow:hidden}
  .wrap{box-sizing:border-box;height:100%;padding:12px 16px;display:flex;flex-direction:column;gap:6px}
  .muted{color:var(--text-muted, #8b93a0)}
  .note{font-size:calc(13px * var(--text-scale, 1));color:var(--text-muted, #8b93a0);letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  [hidden]{display:none!important}
  html.on-light body{color:var(--on-surface,#0b0d10)}
  html.on-light .muted,html.on-light .note{color:var(--on-surface,#0b0d10);opacity:.75}

  .banner{flex:0 0 auto;font-size:calc(12px * var(--text-scale, 1));letter-spacing:.06em;color:#f0a020;background:rgba(240,160,32,.12);border-radius:8px;padding:4px 8px}
  .banner.bad{color:var(--danger, #d9463f);background:rgba(217,70,63,.12)}
  .mark-feedback{font-size:calc(13px * var(--text-scale,1));color:var(--text-muted,#8b93a0);padding:4px 0;line-height:1.35}
  .mark-feedback.bad{color:var(--danger,#d9463f)}
  .head{flex:0 0 auto;display:flex;align-items:center;gap:10px}
  .head .counts{flex:1;font-size:calc(12px * var(--text-scale, 1));color:var(--text-muted, #8b93a0);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* Finger-sized: the button is a touch target, not a link. */
  .head button{min-height:32px;padding:0 12px;border:0;border-radius:8px;font:inherit;font-size:calc(13px * var(--text-scale, 1));
    color:inherit;background:rgba(128,128,128,.16)}
  .head button:active{background:rgba(128,128,128,.32)}
  .scroll{flex:1;min-height:0;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;
    display:flex;flex-direction:column;gap:4px;padding-right:4px}
  .stale{opacity:.55}
  .sect{font-size:calc(11px * var(--text-scale, 1));letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted, #8b93a0);margin:6px 2px 2px}
  /* One source unavailable is one line, not a blank tile. */
  .serr{font-size:calc(12px * var(--text-scale, 1));color:var(--text-muted, #8b93a0);padding:2px 8px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  html.on-light .serr{color:var(--on-surface,#0b0d10);opacity:.7}
  .row{border:0;font:inherit;color:inherit;text-align:left;width:100%;cursor:pointer;display:flex;align-items:center;gap:10px;min-height:40px;padding:6px 8px;border-radius:8px;
    background:rgba(128,128,128,.08)}
  .row:active{background:rgba(128,128,128,.22)}
  .row:focus-visible{outline:2px solid var(--accent,#d9b36a)}
  .row.done{opacity:.4}
  .glyph{flex:0 0 auto;width:22px;text-align:center;font-size:calc(14px * var(--text-scale, 1));font-weight:700;color:var(--text-muted, #8b93a0)}
  .glyph.pr{color:var(--ok, #2fb36b)}.glyph.issue{color:#8ab4f8}.glyph.release{color:#c08af0}
  .glyph.ci{color:#f0a020}.glyph.commit{color:var(--text-muted, #8b93a0)}.glyph.discussion{color:#58b9c9}
  .glyph.draft{color:var(--text-dim, #5f6771)}
  .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
  .title{font-size:calc(14px * var(--text-scale, 1));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sub{font-size:calc(11px * var(--text-scale, 1));color:var(--text-muted, #8b93a0);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .when{flex:0 0 auto;font-size:calc(11px * var(--text-scale, 1));color:var(--text-muted, #8b93a0);font-variant-numeric:tabular-nums}

  html.compact .wrap{padding:0 calc(var(--h,80px) * .12);justify-content:center;gap:0}
  html.compact .head,html.compact .scroll,html.compact .banner{display:none!important}
  .cwrap{display:none;align-items:center;gap:calc(var(--h,80px) * .1)}
  html.compact .cwrap{display:flex}
  html.compact.slot-right .cwrap{justify-content:flex-end}
  .clabel{font-size:calc(calc(var(--h,80px) * .18) * var(--text-scale, 1));letter-spacing:.08em;color:var(--text-muted, #8b93a0)}
  .cnum{font-size:calc(calc(var(--h,80px) * .34) * var(--text-scale, 1));font-weight:600;font-variant-numeric:tabular-nums}
  .cnum.rev{color:var(--accent,#d9b36a)}
  html.accent-fill .cnum.rev{color:var(--on-surface)}

/* Large touch targets and readable hierarchy on the Edge; action handlers are unchanged. */
html:not(.compact) .row{min-height:56px;flex-shrink:0;padding:10px 12px}html:not(.compact) .title{font-size:calc(18px * var(--text-scale,1));line-height:1.3}html:not(.compact) .sub,html:not(.compact) .when{font-size:calc(14px * var(--text-scale,1));line-height:1.3}.head button{min-height:56px;font-size:calc(15px * var(--text-scale,1))}.head .counts{font-size:calc(15px * var(--text-scale,1))}.sect{font-size:calc(13px * var(--text-scale,1))}

  .service-head{display:flex;align-items:center;gap:12px;flex:0 0 auto;padding:4px 0 6px}.service-head h2{margin:0;font-size:calc(24px * var(--text-scale,1));line-height:1.2}.service-icon{width:30px;height:30px;flex:none;color:var(--text,#e6e8eb)}html.on-light .service-icon{color:var(--on-surface,#0b0d10)}html.compact .service-head{display:none}

  .glyph{width:26px;height:26px;display:flex;align-items:center;justify-content:center}.glyph svg{width:24px;height:24px}.head{flex-wrap:wrap;gap:12px}.head .counts{font-size:calc(19px * var(--text-scale,1));font-weight:650}.sect{display:flex;align-items:center;gap:8px}.sect svg{width:20px;height:20px;flex:none}

  .filters{display:grid;grid-template-columns:1fr 1.5fr;gap:10px;flex:0 0 auto}.filters label{display:flex;flex-direction:column;gap:4px;min-width:0;font-size:13px;color:var(--text-muted,#8b93a0)}.filters select{box-sizing:border-box;width:100%;min-height:56px;padding:8px 12px;border:1px solid var(--border,#464c56);border-radius:8px;background:var(--surface-2,#1c2128);color:var(--on-surface,var(--text,#e6e8eb));font:inherit;font-size:15px}.filters select:focus-visible{outline:2px solid var(--accent,#d9b36a);outline-offset:2px}.filter-note{flex:0 0 auto;font-size:12px;color:var(--text-muted,#8b93a0)}html.compact .filters,html.compact .filter-note{display:none!important}
</style></head>
<body><div class="wrap">
  <div class="service-head"><svg class="service-icon" aria-hidden="true" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg><h2><span id="serviceTitle"></span></h2></div>
  <div class="filters" id="filters" hidden><label><span id="ownerLabel"></span><select id="ownerFilter" aria-labelledby="ownerLabel"></select></label><label><span id="repoLabel"></span><select id="repoFilter" aria-labelledby="repoLabel"></select></label></div>
  <div class="filter-note" id="filterNote" hidden></div>
  <div class="banner" id="banner" hidden></div>
  <div class="banner bad" id="openError" hidden></div>
  <div class="mark-feedback" id="markFeedback" role="status" aria-live="polite" hidden></div>
  <div class="head" id="head"><span class="counts" id="counts"></span><button id="markAll" type="button"></button></div>
  <div class="scroll" id="scroll"></div>
  <div class="note" id="empty" hidden></div>
  <div class="cwrap" id="cwrap"><span class="clabel">GH</span><span class="cnum" id="cinbox">0</span><span class="cnum rev" id="creview">0</span></div>
</div>
<script>
  var L = {
    ownerLabel: {fr:'Organisation / compte',en:'Organization / account'},
    repoLabel: {fr:'Dépôt',en:'Repository'},
    allOwners: {fr:'Toutes les organisations / comptes',en:'All organizations / accounts'},
    allRepos: {fr:'Tous les dépôts',en:'All repositories'},
    filterNote: {fr:'Filtres sur les éléments chargés',en:'Filters apply to loaded items'},
    filteredEmpty: {fr:'Aucun élément chargé pour ce filtre',en:'No loaded items match this filter'},

    serviceTitle: {fr: 'Boîte GitHub', en: 'GitHub inbox'},
    openFailed: { fr: 'Impossible d’ouvrir cette page sur le Mac', en: 'Could not open this page on the Mac' },
    notifications: { fr: 'Notifications', en: 'Notifications' },
    reviews: { fr: 'Revues demandées', en: 'Review requests' },
    myPrs: { fr: 'Mes pull requests', en: 'My pull requests' },
    markFiltered: {fr:'Marquer les notifications filtrées lues',en:'Mark filtered notifications read'},
    markAll: { fr: 'Marquer les notifications lues', en: 'Mark notifications read' },
    markSent: { fr: 'Demande envoyée à GitHub. Les revues restent à traiter.', en: 'Request sent to GitHub. Review requests remain to be handled.' },
    markFailed: { fr: 'Marquage impossible. Vérifiez la connexion et les droits du jeton GitHub.', en: 'Could not mark notifications read. Check the connection and GitHub token permissions.' },
    counts: { fr: '{n} non lues · {r} revues', en: '{n} unread · {r} reviews' },
    countsReviews: { fr: '{r} revues', en: '{r} reviews' },
    agoSeconds: { fr: 'il y a {n} s', en: '{n} s ago' },
    agoMinutes: { fr: 'il y a {n} min', en: '{n} min ago' },
    agoHours: { fr: 'il y a {n} h', en: '{n} h ago' },
    agoDays: { fr: 'il y a {n} j', en: '{n} d ago' },
    draft: { fr: 'brouillon', en: 'draft' },
    noConnection: { fr: 'Connexion manquante', en: 'No connection' },
    loading: { fr: 'Chargement…', en: 'Loading…' },
    unauthorized: { fr: 'Jeton refusé', en: 'Token refused' },
    rateLimited: { fr: 'Quota GitHub épuisé', en: 'GitHub quota exhausted' },
    unconfigured: { fr: 'Connexion incomplète', en: 'Connection incomplete' },
    offline: { fr: 'Hors ligne', en: 'Offline' },
    empty: { fr: 'Rien à lire', en: 'Nothing to read' },
    /* One source of the snapshot is unavailable — the others keep drawing. */
    errFineGrained: { fr: 'Notifications : jeton classique requis', en: 'Notifications need a classic token' },
    errForbidden: { fr: 'Pas d’accès', en: 'No access' },
    errNotFound: { fr: 'Dépôt introuvable ou inaccessible à ce jeton', en: 'Repository not found or not accessible by this token' },
    errRateLimited: { fr: 'Quota atteint', en: 'Rate limited' },
    errOffline: { fr: 'Hors ligne', en: 'Offline' },
    reason_assign: { fr: 'assigné', en: 'assigned' },
    reason_author: { fr: 'auteur', en: 'author' },
    reason_comment: { fr: 'commentaire', en: 'comment' },
    reason_mention: { fr: 'mention', en: 'mention' },
    reason_review_requested: { fr: 'revue demandée', en: 'review requested' },
    reason_state_change: { fr: 'état modifié', en: 'state changed' },
    reason_subscribed: { fr: 'abonnement', en: 'subscribed' },
    reason_team_mention: { fr: 'équipe mentionnée', en: 'team mentioned' },
    reason_ci_activity: { fr: 'CI', en: 'CI' }
  }
  /* Local SVGs are decorative; row destinations and readable titles remain the authority. */
  var GLYPH = {"pr": "<svg aria-hidden=\"true\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"6\" cy=\"4\" r=\"2\"/><circle cx=\"6\" cy=\"20\" r=\"2\"/><circle cx=\"18\" cy=\"20\" r=\"2\"/><path d=\"M6 6v12m6-15 3 3-3 3m3-3h1a2 2 0 0 1 2 2v10\"/></svg>", "issue": "<svg aria-hidden=\"true\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7v6m0 4h.01\"/></svg>", "release": "<svg aria-hidden=\"true\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 3h8l10 10-8 8L3 11Z\"/><circle cx=\"7\" cy=\"7\" r=\"1\"/></svg>", "ci": "<svg aria-hidden=\"true\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M8 3H3v5m0-5 5 5m8 13h5v-5m0 5-5-5M3 14v5a2 2 0 0 0 2 2h5M21 10V5a2 2 0 0 0-2-2h-5\"/></svg>", "commit": "<svg aria-hidden=\"true\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"4\"/><path d=\"M2 12h6m8 0h6\"/></svg>", "discussion": "<svg aria-hidden=\"true\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 4h18v13H9l-6 4Z\"/><path d=\"M7 9h10M7 13h6\"/></svg>", "other": "<svg aria-hidden=\"true\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"3\"/></svg>"}
  function glyph(key){return Object.prototype.hasOwnProperty.call(GLYPH,key)?GLYPH[key]:GLYPH.other}
  var ERRORS = { unauthorized: L.unauthorized, 'rate-limited': L.rateLimited, unconfigured: L.unconfigured, offline: L.offline }
  var SECTION_ERRORS = {
    'fine-grained-token': L.errFineGrained, forbidden: L.errForbidden, 'not-found': L.errNotFound,
    unauthorized: L.unauthorized, 'rate-limited': L.errRateLimited, offline: L.errOffline
  }

  var snapshot = null, channel = null, unsub = null
  var show = { notifications: true, reviews: true, myPrs: false }, maxRows = 12
  /* Ids the user has just tapped: drawn as read before the next poll confirms it. */
  var pending = Object.create(null), marking = false


  // A repository owner can be a personal account or an organization. Never infer its type.
  var ownerFilter = '', repoFilter = ''
  function ownerOf(repo) { return String(repo || '').split('/')[0] }
  function matchesFilter(item) { return (!ownerFilter || ownerOf(item.repo).toLowerCase() === ownerFilter.toLowerCase()) && (!repoFilter || String(item.repo).toLowerCase() === repoFilter.toLowerCase()) }
  function hasFilter() { return !!ownerFilter || !!repoFilter }
  function filterOptions(id, values, chosen, allLabel) {
    var select = document.getElementById(id)
    values = Array.from(new Set(values.filter(Boolean))).sort(function(a,b){return a.localeCompare(b)})
    // Keep an explicit selection when a poll has no matching rows, rather than silently showing everything.
    if (chosen && values.indexOf(chosen) === -1) values.push(chosen)
    var options = '<option value=""'+(!chosen?' selected':'')+'>'+Fremkit.esc(Fremkit.t(allLabel))+'</option>' + values.map(function(value){return '<option value="'+Fremkit.esc(value)+'"'+(value===chosen?' selected':'')+'>'+Fremkit.esc(value)+'</option>'}).join('')
    if (select.innerHTML !== options) select.innerHTML = options
    select.value = chosen
  }
  function renderFilters(items, configured) {
    var repoNames = (configured || []).concat(items.map(function(item){return item.repo})).filter(Boolean)
    document.getElementById('filters').hidden = !snapshot || !channel
    document.getElementById('filterNote').hidden = !snapshot || !channel
    document.getElementById('ownerLabel').textContent = Fremkit.t(L.ownerLabel)
    document.getElementById('repoLabel').textContent = Fremkit.t(L.repoLabel)
    document.getElementById('filterNote').textContent = Fremkit.t(L.filterNote)
    filterOptions('ownerFilter',repoNames.map(ownerOf),ownerFilter,L.allOwners)
    filterOptions('repoFilter',repoNames.filter(function(repo){return !ownerFilter || ownerOf(repo).toLowerCase()===ownerFilter.toLowerCase()}),repoFilter,L.allRepos)
  }
  function bindFilters() {
    document.getElementById('ownerFilter').addEventListener('change',function(event){ownerFilter=event.target.value;repoFilter='';render()})
    document.getElementById('repoFilter').addEventListener('change',function(event){repoFilter=event.target.value;render()})
  }

  function ago(ms) {
    var s = Math.max(0, Math.round(ms / 1000))
    if (s < 60) return Fremkit.t(L.agoSeconds, { n: s })
    var m = Math.floor(s / 60)
    if (m < 60) return Fremkit.t(L.agoMinutes, { n: m })
    var h = Math.floor(m / 60)
    if (h < 24) return Fremkit.t(L.agoHours, { n: h })
    return Fremkit.t(L.agoDays, { n: Math.floor(h / 24) })
  }
  function reason(key) {
    var entry = L['reason_' + String(key || '').replace(/[^a-z_]/g, '')]
    return entry ? Fremkit.t(entry) : String(key || '')
  }
  function section(label) { return '<div class="sect">' + (label===L.notifications?"<svg aria-hidden=\"true\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M9 21h6\"/></svg>":GLYPH.pr) + Fremkit.esc(Fremkit.t(label)) + '</div>' }
  function sectionError(code) {
    var entry = SECTION_ERRORS[code] || L.errOffline
    return '<div class="serr">' + Fremkit.esc(Fremkit.t(entry)) + '</div>'
  }
  function sectionErrors() { return (snapshot && snapshot.errors) || {} }
  function notificationRow(n, now) {
    return '<button type="button" class="row' + (pending[n.id] ? ' done' : '') + '" data-kind="notification" data-id="' + Fremkit.esc(n.id) + '">' +
      '<span class="glyph ' + Fremkit.esc(n.type) + '">' + glyph(n.type) + '</span>' +
      '<span class="body"><span class="title">' + Fremkit.esc(n.title) + '</span>' +
      '<span class="sub">' + Fremkit.esc(n.repo) + ' · ' + Fremkit.esc(reason(n.reason)) + '</span></span>' +
      '<span class="when">' + Fremkit.esc(ago(now - n.updatedAt)) + '</span></button>'
  }
  function pullRow(p, now, kind) {
    return '<button type="button" class="row" data-id="' + Fremkit.esc(p.id) + '" data-kind="' + kind + '">' +
      '<span class="glyph ' + (p.draft ? 'draft' : 'pr') + '">' + GLYPH.pr + '</span>' +
      '<span class="body"><span class="title">' + Fremkit.esc(p.title) + '</span>' +
      '<span class="sub">' + Fremkit.esc(p.repo) + ' #' + Fremkit.esc(p.number) + ' · ' + Fremkit.esc(p.author) +
      (p.draft ? ' · ' + Fremkit.esc(Fremkit.t(L.draft)) : '') + '</span></span>' +
      '<span class="when">' + Fremkit.esc(ago(now - p.updatedAt)) + '</span></button>'
  }

  function renderCompact() {
    var unread = snapshot ? (snapshot.notifications || []).filter(function (n) { return !pending[n.id] }).length : 0
    var reviews = snapshot ? (snapshot.reviewRequests || []).length : 0
    // A number the connection cannot know is worse than no number: show only what is available.
    var noInbox = !!sectionErrors().notifications
    document.getElementById('cinbox').hidden = noInbox
    document.getElementById('cinbox').textContent = unread
    document.getElementById('creview').hidden = !!sectionErrors().reviews
    document.getElementById('creview').textContent = reviews
  }

  var openErrorUntil = 0
  function openRow(row) {
    if (!channel || !row) return
    var id = row.getAttribute('data-id'), kind = row.getAttribute('data-kind')
    if (!id || !kind) return
    Promise.resolve(Fremkit.sendCommand(channel, 'open', { kind: kind, id: id }))
      .then(function (result) { if (!result || !result.ok) throw new Error('open failed') })
      .catch(function () { openErrorUntil = Date.now() + 5000; render() })
  }
  function render() {
    document.getElementById('serviceTitle').textContent = Fremkit.t(L.serviceTitle)
    var openError = document.getElementById('openError')
    openError.hidden = Date.now() >= openErrorUntil
    openError.textContent = Fremkit.t(L.openFailed)
    if (Fremkit.compact) { renderCompact(); return }
    renderFilters(snapshot ? (snapshot.notifications || []).concat(snapshot.reviewRequests || [], snapshot.myPrs || []) : [])
    var banner = document.getElementById('banner'), scroll = document.getElementById('scroll')
    var empty = document.getElementById('empty'), head = document.getElementById('head')
    if (!channel) {
      banner.hidden = false; banner.className = 'banner bad'; banner.textContent = Fremkit.t(L.noConnection)
      scroll.hidden = true; head.hidden = true; empty.hidden = true; return
    }
    if (!snapshot) {
      banner.hidden = true; scroll.hidden = true; head.hidden = true
      empty.hidden = false; empty.textContent = Fremkit.t(L.loading); return
    }
    head.hidden = false
    scroll.hidden = false
    var err = snapshot.error
    banner.hidden = !err
    if (err) {
      banner.className = 'banner' + (err === 'unauthorized' || err === 'unconfigured' ? ' bad' : '')
      banner.textContent = Fremkit.t(ERRORS[err] || L.offline)
    }
    scroll.classList.toggle('stale', !!err)

    var now = Date.now()
    var errs = sectionErrors()
    var notifications = (snapshot.notifications || []).filter(function (n) { return !pending[n.id] && matchesFilter(n) })
    var reviews = (snapshot.reviewRequests || []).filter(matchesFilter), mine = (snapshot.myPrs || []).filter(matchesFilter)
    // A count for a source that could not be read would be a lie; drop it from the line instead.
    document.getElementById('counts').textContent = errs.notifications
      ? (errs.reviews ? '' : Fremkit.t(L.countsReviews, { r: (snapshot.reviewRequests || []).length >= 25 ? reviews.length + '+' : reviews.length }))
      : Fremkit.t(L.counts, { n: (snapshot.notifications || []).length >= 50 ? notifications.length + '+' : notifications.length, r: (snapshot.reviewRequests || []).length >= 25 ? reviews.length + '+' : reviews.length })
    document.getElementById('markAll').textContent = Fremkit.t(hasFilter() ? L.markFiltered : L.markAll)
    document.getElementById('markAll').hidden = !!errs.notifications
    document.getElementById('markAll').disabled = marking || notifications.length === 0

    var html = '', drawn = 0, noted = 0
    function take(list) { var slice = list.slice(0, Math.max(0, maxRows - drawn)); drawn += slice.length; return slice }
    /* A failed source shows its header and one line, so the tile says which half is missing. */
    function part(label, key, list, row) {
      if (errs[key]) { html += section(label) + sectionError(errs[key]); noted++; return }
      var rows = take(list)
      if (rows.length) html += section(label) + rows.map(row).join('')
    }
    if (show.notifications) part(L.notifications, 'notifications', notifications, function (n) { return notificationRow(n, now) })
    if (show.reviews) part(L.reviews, 'reviews', reviews, function (p) { return pullRow(p, now, 'review') })
    if (show.myPrs) part(L.myPrs, 'myPrs', mine, function (p) { return pullRow(p, now, 'pull') })
    scroll.innerHTML = html
    empty.hidden = drawn > 0 || noted > 0
    empty.textContent = Fremkit.t(hasFilter() ? L.filteredEmpty : L.empty)
  }

  function markRead(id) {
    if (!channel || !id || pending[id]) return
    // Optimistic: the row greys out at once and the next poll confirms it. A refusal puts it back.
    pending[id] = true
    render()
    var result = Fremkit.sendCommand(channel, 'markRead', { id: id })
    if (result && typeof result.catch === 'function') {
      result.catch(function (err) { delete pending[id]; render(); console.error('markRead failed', err) })
    }
  }

  function applySettings(s) {
    show = {
      notifications: s.showNotifications !== false,
      reviews: s.showReviews !== false,
      myPrs: s.showMyPrs === true
    }
    maxRows = Number(s.max) > 0 ? Number(s.max) : 12
    var next = s.connection ? 'github:' + s.connection : null
    if (next !== channel) {
      if (unsub) { unsub(); unsub = null }
      // Another account's inbox is not this one's, so nothing is carried over.
      snapshot = null
      ownerFilter = ''; repoFilter = ''
      document.getElementById('markFeedback').hidden = true
      pending = Object.create(null); marking = false
      channel = next
      if (channel) unsub = Fremkit.subscribe(channel, function (d) { snapshot = d; render() })
    }
    render()
  }

  Fremkit.whenReady(function () {
    document.documentElement.lang = Fremkit.locale
    bindFilters()
    document.documentElement.style.setProperty('--h', Fremkit.size.px.height + 'px')
    Fremkit.onResize(function (size) { document.documentElement.style.setProperty('--h', size.px.height + 'px'); render() })
    Fremkit.onLocale(function (locale) { document.documentElement.lang = locale; render() })
    applySettings(Fremkit.settings)
    Fremkit.onSettings(function (next) { applySettings(next || {}) })

    document.getElementById('scroll').addEventListener('click', function (e) {
      var row = e.target.closest('.row')
      if (!row) return
      openRow(row)
    })
    document.getElementById('markAll').addEventListener('click', function () {
      if (!channel || !snapshot || marking) return
      var selectedNotifications = (snapshot.notifications || []).filter(function(n){return !pending[n.id] && matchesFilter(n)})
      if (!selectedNotifications.length) return
      var actionChannel = channel, scoped = hasFilter(), failedIds = []
      selectedNotifications.forEach(function(n){pending[n.id]=true})
      marking = true; render()
      var feedback = document.getElementById('markFeedback'); feedback.hidden = true
      function send(command,payload){return Promise.resolve().then(function(){return Fremkit.sendCommand(actionChannel,command,payload)}).then(function(result){if(!result||!result.ok)throw new Error('mark refused')})}
      var operation = scoped ? Promise.all(selectedNotifications.map(function(n){return send('markRead',{id:n.id}).catch(function(){failedIds.push(n.id)})})).then(function(){if(failedIds.length)throw new Error('partial marking')}) : send('markAllRead',{}).catch(function(error){failedIds=selectedNotifications.map(function(n){return n.id});throw error})
      operation.then(function(){
        if(channel!==actionChannel)return
        marking=false;render();feedback.className='mark-feedback';feedback.textContent=Fremkit.t(L.markSent);feedback.hidden=false
      },function(){
        if(channel!==actionChannel)return
        failedIds.forEach(function(id){delete pending[id]});marking=false;render();feedback.className='mark-feedback bad';feedback.textContent=Fremkit.t(L.markFailed);feedback.hidden=false
      })
    })
    setInterval(render, 30000)
  })
</script></body></html>
