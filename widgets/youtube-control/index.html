<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YouTube from Chrome</title><style>
html,body{margin:0;height:100%;background:transparent;color:var(--on-surface,var(--text,#eee));font:16px var(--font,system-ui,sans-serif);overflow:hidden}*{box-sizing:border-box}[hidden]{display:none!important}.wrap{height:100%;padding:20px;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px}.screen{position:relative;min-height:0;background:rgba(0,0,0,.4);border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center}video{width:100%;height:100%;object-fit:contain;display:block}.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;gap:16px}.logo{width:84px;height:60px;color:#ff4545}.empty h1{margin:0;font-size:30px}.empty p{margin:0;max-width:640px;font-size:18px;line-height:1.5;opacity:.75}.sidebar{display:flex;flex-direction:column;gap:14px;min-height:0;overflow-y:auto}.brand{display:flex;gap:10px;align-items:center;font-size:24px;font-weight:650}.brand .logo{width:38px;height:28px}.status{font-size:14px;line-height:1.4;color:var(--text-muted,#99a0aa)}h2{font-size:22px;line-height:1.3;margin:0;overflow-wrap:anywhere}.time{font-variant-numeric:tabular-nums;opacity:.8}.progress{width:100%;height:6px;accent-color:#ff4545}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{min-height:56px;border:1px solid var(--border,#464c56);border-radius:10px;background:var(--surface-2,#252a32);color:inherit;font:inherit;padding:10px 14px;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--accent,#d9b36a);outline-offset:2px}button:disabled{opacity:.4;cursor:default}.wide{grid-column:1/-1}.primary{background:#ba2727;color:#fff;border-color:#ba2727}.volume{width:100%;height:44px;accent-color:#ff4545}.setup{margin-top:auto;border-top:1px solid var(--border,#464c56);padding-top:14px;display:flex;flex-direction:column;gap:10px}.code{font-size:32px;letter-spacing:.2em;font-weight:650;text-align:center}.hint{font-size:13px;line-height:1.5;opacity:.75}.feedback{font-size:14px;line-height:1.4;color:var(--accent,#d9b36a)}html.on-light .status{color:var(--on-surface,#111);opacity:.75}@media(max-width:1000px){.wrap{grid-template-columns:minmax(0,1fr) 300px;gap:12px;padding:12px}}@media(max-width:700px){.wrap{grid-template-columns:1fr;grid-template-rows:minmax(200px,1fr) auto}.sidebar{max-height:260px}.setup{margin:0}}
</style></head><body><div class="wrap"><div class="screen"><video id="video" autoplay muted playsinline hidden></video><div class="empty" id="empty"><svg class="logo" viewBox="0 0 32 24" aria-hidden="true"><rect x="1" y="2" width="30" height="20" rx="6" fill="currentColor"/><path d="m13 7 9 5-9 5Z" fill="white"/></svg><h1 id="emptyTitle"></h1><p id="emptyText"></p></div></div><aside class="sidebar"><div class="brand"><svg class="logo" viewBox="0 0 32 24" aria-hidden="true"><rect x="1" y="2" width="30" height="20" rx="6" fill="currentColor"/><path d="m13 7 9 5-9 5Z" fill="white"/></svg>YouTube</div><div class="status" id="status" role="status"></div><h2 id="title"></h2><div class="time" id="time"></div><progress class="progress" id="progress" max="1" value="0"></progress><div class="controls"><button class="primary wide" id="toggle" data-action="toggle"></button><button data-action="seek" data-delta="-10">↶ 10 s</button><button data-action="seek" data-delta="10">10 s ↷</button><button id="mute" data-action="mute"></button><button id="show" data-action="show"></button><button class="wide" id="stop" data-action="stop"></button></div><label for="volume" id="volumeLabel"></label><input id="volume" class="volume" type="range" min="0" max="100" step="5" value="100"><div class="feedback" id="feedback" role="status" aria-live="polite"></div><div class="setup"><button id="pair"></button><div class="code" id="code" hidden></div><div class="hint" id="setupHint"></div></div></aside></div><script>
var L={ready:{fr:'Vidéo de l’onglet Chrome choisi',en:'Selected Chrome tab video'},idle:{fr:'Aucune vidéo partagée',en:'No shared video'},empty:{fr:'Ouvre une vidéo YouTube dans Chrome, puis clique sur l’extension « YouTube XENEON » et sur « Afficher cet onglet ».',en:'Open a YouTube video in Chrome, then use the YouTube XENEON extension to share that tab.'},setup:{fr:'Première connexion : génère un code ici et saisis-le dans l’extension Chrome. Le son reste dans Chrome.',en:'First connection: generate a code here and enter it in the Chrome extension. Audio stays in Chrome.'},pair:{fr:'Connecter Chrome',en:'Connect Chrome'},play:{fr:'▶ Lire',en:'▶ Play'},pause:{fr:'Ⅱ Pause',en:'Ⅱ Pause'},mute:{fr:'Couper le son',en:'Mute'},unmute:{fr:'Rétablir le son',en:'Unmute'},show:{fr:'Voir dans Chrome',en:'Show in Chrome'},stop:{fr:'Arrêter le partage',en:'Stop sharing'},volume:{fr:'Volume YouTube',en:'YouTube volume'},waiting:{fr:'Connexion de l’image…',en:'Connecting video…'},playing:{fr:'Image reçue · son dans Chrome',en:'Video received · audio in Chrome'},paused:{fr:'En pause · son dans Chrome',en:'Paused · audio in Chrome'},failed:{fr:'Action impossible. Vérifie le partage dans Chrome.',en:'Action unavailable. Check sharing in Chrome.'},unsupported:{fr:'Réception vidéo indisponible dans cette fenêtre',en:'Video reception unavailable in this window'},stale:{fr:'Partage interrompu',en:'Sharing interrupted'},code:{fr:'Code valable 90 secondes',en:'Code valid for 90 seconds'},uncropped:{fr:'Vue de l’onglet complet',en:'Full tab view'}};
var snapshot=null,receiverId=null,activeSession=null,peer=null,offer=null,busy=false,watchAt=0,codeUntil=0,lastFrame=0;
function t(key){return Fremkit.t(L[key])}function el(id){return document.getElementById(id)}function fresh(){return snapshot&&snapshot.state==='sharing'&&snapshot.meta&&typeof snapshot.updatedAt==='number'&&Date.now()-snapshot.updatedAt<=10000&&!snapshot.error}function clock(sec){if(!Number.isFinite(sec))return '—';var n=Math.floor(sec),h=Math.floor(n/3600),m=Math.floor(n%3600/60),s=String(n%60).padStart(2,'0');return (h?h+':'+String(m).padStart(2,'0'):m)+':'+s}
function uuid(){if(crypto.randomUUID)return crypto.randomUUID();var b=crypto.getRandomValues(new Uint8Array(16));b[6]=(b[6]&15)|64;b[8]=(b[8]&63)|128;var h=Array.from(b,function(v){return v.toString(16).padStart(2,'0')}).join('');return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20)}
function reset(){peer&&peer.close();peer=null;offer=null;receiverId=null;activeSession=null;busy=false;lastFrame=0;el('video').srcObject=null;el('video').hidden=true}
function gather(p){return new Promise(function(resolve,reject){if(p.iceGatheringState==='complete')return resolve();var timeout=setTimeout(function(){p.removeEventListener('icegatheringstatechange',change);reject(Error('ICE timeout'))},6000);function change(){if(p.iceGatheringState==='complete'){clearTimeout(timeout);p.removeEventListener('icegatheringstatechange',change);resolve()}}p.addEventListener('icegatheringstatechange',change)})}
function localCandidates(sdp){return sdp.split(/\r?\n/).filter(function(line){if(!line.startsWith('a=candidate:'))return true;var p=line.split(/\s+/),h=p[4];return p[7]==='host'&&(/^[a-z0-9-]+\.local$/i.test(h)||/^(127\.|10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.|169\.254\.|fe80:|f[cd][0-9a-f]{2}:)/i.test(h)||h==='::1')}).join('\r\n')}
async function attach(){if(!fresh()||busy)return;if(typeof RTCPeerConnection==='undefined'){el('feedback').textContent=t('unsupported');return}if(activeSession!==snapshot.sessionId){reset();activeSession=snapshot.sessionId;receiverId=uuid();watchAt=0}
 var session=activeSession,id=receiverId,entry=(snapshot.receivers||[]).find(function(r){return r.id===id});busy=true;
 try{if(Date.now()-watchAt>10000){watchAt=Date.now();var accepted=await Fremkit.sendCommand('youtube','view',{sessionId:session,receiverId:id});if(!accepted||!accepted.ok)throw Error('view')}
 if(entry&&entry.offer&&offer!==entry.offer&&session===activeSession){offer=entry.offer;peer&&peer.close();var p=new RTCPeerConnection({iceServers:[],bundlePolicy:'max-bundle'});peer=p;p.ontrack=function(event){if(peer!==p)return;el('video').srcObject=event.streams[0];lastFrame=Date.now();el('video').play().catch(function(){el('feedback').textContent=t('failed')});render()};p.onconnectionstatechange=function(){if(peer!==p)return;if(p.connectionState==='disconnected'){el('feedback').textContent=t('stale');render()}else if(p.connectionState==='connected'){lastFrame=Date.now();el('video').play().catch(function(){});render()}else if(p.connectionState==='failed'){el('video').srcObject=null;lastFrame=0;peer.close();peer=null;offer=null;receiverId=uuid();watchAt=0;el('feedback').textContent=t('stale');render()}};await p.setRemoteDescription({type:'offer',sdp:entry.offer});await p.setLocalDescription(await p.createAnswer());await gather(p);if(peer!==p||activeSession!==session)return;var answer=await Fremkit.sendCommand('youtube','answer',{sessionId:session,receiverId:id,sdp:localCandidates(p.localDescription.sdp)});if(!answer||!answer.ok)throw Error('answer')}
 }catch{if(activeSession===session)el('feedback').textContent=t('failed')}finally{if(activeSession===session)busy=false}}
function render(){document.documentElement.lang=Fremkit.locale;var active=fresh(),m=active?snapshot.meta:null;if(!active&&activeSession)reset();var visible=active&&el('video').srcObject&&(m.paused||Date.now()-lastFrame<8000);el('video').hidden=!visible;el('empty').hidden=!!visible;el('emptyTitle').textContent=t(active?'waiting':'idle');el('emptyText').textContent=t('empty');el('status').textContent=t(visible?(m.paused?'paused':'playing'):active?'waiting':'idle')+(m&&!m.crop?' · '+t('uncropped'):'');el('title').textContent=m?m.title:'';el('time').textContent=m?clock(m.currentTime)+' / '+clock(m.duration):'';el('progress').value=m&&m.duration?m.currentTime/m.duration:0;el('toggle').textContent=t(m&&m.paused?'play':'pause');el('mute').textContent=t(m&&m.muted?'unmute':'mute');el('show').textContent=t('show');el('stop').textContent=t('stop');el('pair').textContent=t('pair');el('volumeLabel').textContent=t('volume');el('setupHint').textContent=t(codeUntil>Date.now()?'code':'setup');el('code').hidden=codeUntil<=Date.now();document.querySelectorAll('[data-action]').forEach(function(b){b.disabled=!active});el('volume').disabled=!active;if(m)el('volume').value=Math.round(m.volume*100);if(active)attach()}
function trackFrames(){var video=el('video');if(video.requestVideoFrameCallback)video.requestVideoFrameCallback(function frame(){lastFrame=Date.now();video.requestVideoFrameCallback(frame)});else video.addEventListener('timeupdate',function(){lastFrame=Date.now()})}
function control(action,payload){if(!fresh())return;Fremkit.sendCommand('youtube','control',Object.assign({sessionId:snapshot.sessionId,action:action},payload||{})).then(function(r){if(!r||!r.ok)throw Error('refused')},function(){el('feedback').textContent=t('failed')}).catch(function(){el('feedback').textContent=t('failed')})}
Fremkit.whenReady(function(){trackFrames();document.querySelectorAll('[data-action]').forEach(function(button){button.addEventListener('click',function(){var action=button.getAttribute('data-action');control(action,action==='seek'?{delta:Number(button.getAttribute('data-delta'))}:{})})});el('volume').addEventListener('change',function(event){control('volume',{value:Number(event.target.value)/100})});el('pair').addEventListener('click',async function(){try{var r=await Fremkit.sendCommand('youtube','pair',{});if(!r||!r.ok)throw Error('pair');el('code').textContent=r.code;codeUntil=r.expiresAt;render()}catch{el('feedback').textContent=t('failed')}});Fremkit.subscribe('youtube',function(data){snapshot=data;render()});Fremkit.onLocale(render);render();setInterval(render,1000);window.addEventListener('pagehide',reset)});
</script></body></html>
