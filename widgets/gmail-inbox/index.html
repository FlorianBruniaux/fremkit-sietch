<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gmail inbox</title>
<style>
html,body{margin:0;height:100%;background:transparent;color:var(--on-surface,var(--text,#e6e8eb));font-family:var(--font,-apple-system,system-ui,sans-serif);overflow:hidden}
*{box-sizing:border-box}[hidden]{display:none!important}
.wrap{height:100%;padding:14px 18px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;touch-action:pan-y}
.filters{display:flex;gap:10px;flex-wrap:wrap}.filter{flex:1;min-width:140px;display:flex;flex-direction:column;gap:4px}
label,.meta,.status,.notice{font-size:calc(15px * var(--text-scale,1));line-height:1.4}.meta,.status,.notice,label{color:inherit;opacity:.85}
select,button{font:inherit;font-size:calc(16px * var(--text-scale,1));color:inherit;background:rgba(128,128,128,.12);border:1px solid rgba(128,128,128,.4);border-radius:8px;min-height:56px;padding:8px 12px}
select{width:100%;max-width:100%;text-overflow:ellipsis}select option{color:var(--text,#e6e8eb);background:var(--surface,#22252b)}
html.on-light select option{color:var(--on-surface,#121419);background:var(--surface,#fff)}
button:not(:disabled){cursor:pointer}button:disabled{opacity:.65;cursor:default}
button:focus-visible,select:focus-visible{outline:3px solid var(--accent,#d9b36a);outline-offset:2px}
#feedback{border-left:4px solid var(--accent,#d9b36a);padding:10px 12px;opacity:1;font-weight:600}
#accounts{display:flex;gap:8px;flex-wrap:wrap}.status{flex:1;min-width:160px;padding:8px 10px;border:1px solid rgba(128,128,128,.35);border-radius:8px;overflow-wrap:anywhere}.status strong{font-weight:600}
#list{flex:1 0 150px;min-height:150px;overflow:auto;touch-action:pan-y;display:flex;flex-direction:column;gap:10px;padding:2px 3px}
.row{display:flex;gap:12px;align-items:center;min-height:96px;padding:10px 12px;border-radius:8px;background:rgba(128,128,128,.08);flex-shrink:0}
.content{flex:1;min-width:0}.title{font-size:calc(20px * var(--text-scale,1));font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sender{font-size:calc(17px * var(--text-scale,1));overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.identity{overflow-wrap:anywhere}.actions{display:flex;gap:8px;flex-shrink:0}.notice{flex-shrink:0;overflow-wrap:anywhere}.next{font-size:calc(18px * var(--text-scale,1));line-height:1.4;flex-shrink:0}
html.on-light .row{background:rgba(0,0,0,.05)}html.accent-fill button:focus-visible,html.accent-fill select:focus-visible{outline-color:var(--on-surface,#fff)}
.cwrap{display:none;height:100%;width:100%;align-items:center;padding:0 calc(var(--h,80px) * .1)}.cline{min-width:0;max-height:100%;font-size:calc(clamp(14px,calc(var(--h,80px) * .23),18px) * var(--text-scale,1));line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:pre-line}
html.compact .wrap{display:none}html.compact .cwrap{display:flex}html.compact.slot-right .cwrap{justify-content:flex-end;text-align:right}
@media(max-width:520px){.wrap{padding:10px;gap:8px}.row{align-items:stretch;flex-direction:column;gap:8px}.actions{justify-content:flex-end}.title{font-size:calc(18px * var(--text-scale,1))}.status{min-width:120px}}

.service{display:flex;align-items:center;gap:10px;flex-shrink:0;font-size:calc(19px * var(--text-scale,1));font-weight:650;line-height:1.2}.service-icon{width:30px;height:30px;flex-shrink:0}.cwrap{gap:10px}.cwrap .service-icon{width:24px;height:24px}
.account-dot{display:inline-block;width:10px;height:10px;margin-right:8px;border-radius:50%;background:var(--account-color,var(--accent,#d9b36a));box-shadow:0 0 0 1px currentColor;flex-shrink:0}.status{border-left:4px solid var(--account-color,var(--accent,#d9b36a));opacity:1}.row{border-left:4px solid var(--account-color,var(--accent,#d9b36a))}.state{opacity:.85}.state::before{content:'';display:inline-block;width:7px;height:7px;margin-right:6px;border-radius:50%;background:var(--accent,#d9b36a)}[data-state="fresh"] .state::before{background:var(--success,#69c99a)}[data-state="stale"] .state::before{background:var(--warning,#f0c269)}[data-state="unavailable"] .state::before{background:var(--danger,#f48787)}html.on-light [data-state="fresh"] .state::before{background:var(--success,#177245)}html.on-light [data-state="stale"] .state::before{background:var(--warning,#8f5900)}html.on-light [data-state="unavailable"] .state::before{background:var(--danger,#b3261e)}html.accent-fill .service-icon{filter:drop-shadow(0 0 1px currentColor)}
</style></head>
<body><div class="wrap"><div class="service"><svg class="service-icon" viewBox="0 0 32 24" aria-hidden="true" focusable="false"><path fill="#4285f4" d="M2 4h5v20H2z"/><path fill="#34a853" d="M25 4h5v20h-5z"/><path fill="#ea4335" d="M2 4V1l14 10L30 1v3L16 15z"/><path fill="#fbbc04" d="M25 4l5-3v8l-5 4z"/><path fill="#c5221f" d="M2 1l5 3v9l-5-4z"/></svg><span>Gmail</span></div>
<div class="filters"><div class="filter"><label id="accountLabel" for="accountFilter"></label><select id="accountFilter"></select></div></div>
<div id="accounts"></div>
<div class="notice" id="route"></div><div class="notice" id="feedback" role="status" aria-live="polite" hidden></div><div id="list" role="list"></div><div class="notice" id="summary"></div><div class="notice" id="setup"></div>
</div><div class="cwrap"><svg class="service-icon" viewBox="0 0 32 24" aria-hidden="true" focusable="false"><path fill="#4285f4" d="M2 4h5v20H2z"/><path fill="#34a853" d="M25 4h5v20h-5z"/><path fill="#ea4335" d="M2 4V1l14 10L30 1v3L16 15z"/><path fill="#fbbc04" d="M25 4l5-3v8l-5 4z"/><path fill="#c5221f" d="M2 1l5 3v9l-5-4z"/></svg><div class="cline" id="compact"></div></div>
<script>
var L = {
  compactEstimate:{fr:'~{n} non lus',en:'~{n} unread'},
  moreAccounts:{fr:'+{n} comptes',en:'+{n} accounts'},
  "allAccounts": {
    "fr": "Tous les comptes",
    "en": "All accounts"
  },
  "account": {
    "fr": "Compte",
    "en": "Account"
  },
  "accountUnknown": {
    "fr": "Identité du compte inconnue",
    "en": "Account identity unknown"
  },
  "loading": {
    "fr": "Chargement…",
    "en": "Loading…"
  },
  "unknown": {
    "fr": "Données inconnues",
    "en": "Data unknown"
  },
  "stale": {
    "fr": "Périmé",
    "en": "Stale"
  },
  "updated": {
    "fr": "Mis à jour : {time}",
    "en": "Updated: {time}"
  },
  "setup": {
    "fr": "Dans l’administration : Connexions → Google, autorisez ou reconnectez le compte ; puis sélectionnez les comptes dans les paramètres du widget.",
    "en": "In admin: Connections → Google, authorize or reconnect the account; then select accounts in widget settings."
  },
  "none": {
    "fr": "Aucun compte sélectionné",
    "en": "No account selected"
  },
  "route": {
    "fr": "Le routage du compte dans le navigateur n’est pas vérifié",
    "en": "Browser account routing is unverified"
  },
  "open": {
    "fr": "Ouvrir",
    "en": "Open"
  },
  "shown": {
    "fr": "{n} sur {total} chargés affichés",
    "en": "Showing {n} of {total} loaded"
  },
  "partial": {
    "fr": "Certains comptes ou calendriers sont indisponibles",
    "en": "Some accounts or calendars are unavailable"
  },
  "unconfigured": {
    "fr": "Compte non configuré",
    "en": "Account not configured"
  },
  "unauthorized": {
    "fr": "Autorisation requise",
    "en": "Authorization required"
  },
  "forbidden": {
    "fr": "Accès refusé",
    "en": "Access denied"
  },
  "offline": {
    "fr": "Hors ligne",
    "en": "Offline"
  },
  "timeout": {
    "fr": "Délai dépassé",
    "en": "Request timed out"
  },
  "rateLimited": {
    "fr": "Quota atteint",
    "en": "Rate limited"
  },
  "malformed": {
    "fr": "Données du fournisseur invalides",
    "en": "Invalid provider data"
  },
  "empty": {
    "fr": "Aucun courrier non lu",
    "en": "No unread mail"
  },
  "estimate": {
    "fr": "Estimation non lus : {n}",
    "en": "Unread estimate: {n}"
  },
  "estimateUnknown": {
    "fr": "Estimation des non lus inconnue",
    "en": "Unread estimate unknown"
  },
  "more": {
    "fr": "Autres courriers disponibles",
    "en": "More mail available"
  },
  "subject": {
    "fr": "(sans objet)",
    "en": "(no subject)"
  },
  "sender": {
    "fr": "Expéditeur inconnu",
    "en": "Sender unknown"
  },
  "date": {
    "fr": "Date inconnue",
    "en": "Date unknown"
  },
  "headers": {
    "fr": "{n} en-têtes chargés",
    "en": "{n} headers loaded"
  }
}
L.opening={fr:'Ouverture sur le Mac…',en:'Opening on the Mac…'}
L.openOk={fr:'Mail ouvert sur le Mac',en:'Mail opened on the Mac'}
L.openFailed={fr:'Impossible d’ouvrir le mail',en:'Could not open mail'}
L.browserHelp={fr:'Ouvrir affiche le mail dans le navigateur du Mac, avec le compte associé.',en:'Open displays mail in the Mac browser using the associated account.'}
var feedbackKey='', feedbackConnectionId='', actionRevision=0
L.fresh={fr:'À jour',en:'Up to date'}
var FAMILY = 'gmail'
var settings = {}, snapshots = Object.create(null), unsubs = [], generation = 0, accountFilter = '', maxRows = 8
function t(key, params) { return Fremkit.t(L[key], params) }
function esc(value) { return Fremkit.esc(value == null ? '' : value) }
function selected() { return Array.isArray(settings.accounts) ? settings.accounts.filter(function(id, i, a) { return typeof id === 'string' && id.length > 0 && a.indexOf(id) === i }).slice(0,50) : [] }
function active() { return selected().filter(function(id) { return !accountFilter || id === accountFilter }) }
function label(id) { var s = snapshots[id]; return s && s.account && s.account.email ? s.account.email : t('accountUnknown') + ' · ' + id }
function accountColor(id) { var s=snapshots[id], color=s && s.account && s.account.color; return typeof color==='string' && /^#[0-9a-f]{6}$/i.test(color) ? color : 'var(--accent,#d9b36a)' }
function accountStyle(id) { return ' style="--account-color:' + accountColor(id) + '"' }
function accountDot() { return '<span class="account-dot" aria-hidden="true"></span>' }
function stateKind(part) { return ageFresh(part) ? 'fresh' : part && part.freshness==='stale' || part && part.freshness==='fresh' ? 'stale' : 'unavailable' }
function ageFresh(part) { return part && part.freshness === 'fresh' && !part.error && typeof part.updatedAt === 'number' && Number.isFinite(part.updatedAt) && Date.now() >= part.updatedAt && Date.now() - part.updatedAt <= 120000 }
function timestamp(value) { if (typeof value !== 'number' || !Number.isFinite(value)) return t('unknown'); try { return new Intl.DateTimeFormat(Fremkit.locale === 'fr' ? 'fr-FR' : 'en-GB',{ dateStyle:'short',timeStyle:'short' }).format(new Date(value)) } catch (_) { return t('unknown') } }
function state(part) { if (!part) return t('loading'); var bits = []; if (ageFresh(part)) bits.push(t('fresh')); if (part.freshness === 'stale' || (part.freshness === 'fresh' && !ageFresh(part))) bits.push(t('stale')); if (part.error) bits.push(t(Object.prototype.hasOwnProperty.call(L,part.error) ? part.error : 'malformed')); if (part.freshness === 'unavailable' || part.updatedAt == null) bits.push(t('unknown')); if (part.updatedAt != null) bits.push(t('updated',{time:timestamp(part.updatedAt)})); return bits.join(' · ') }
function filters() { var select = document.getElementById('accountFilter'); select.innerHTML = '<option value="">' + esc(t('allAccounts')) + '</option>' + selected().map(function(id) { return '<option value="' + esc(id) + '">' + esc(label(id)) + '</option>' }).join(''); select.value = accountFilter; document.getElementById('accountLabel').textContent = t('account') }
function resetSubscriptions() {
  var token = ++generation
  snapshots = Object.create(null)
  unsubs.forEach(function(off) { off() }); unsubs = []
  clearFeedback()
  render() // Remove every prior account row before even a synchronous new subscription callback.
  active().forEach(function(id) {
    unsubs.push(Fremkit.subscribe(FAMILY + ':' + id,function(data) {
      if (token !== generation || active().indexOf(id) < 0) return
      if (!data || data.connectionId !== id) { if (id === feedbackConnectionId) clearFeedback(); delete snapshots[id]; render(); return }
      if (id === feedbackConnectionId) clearFeedback()
      snapshots[id] = data; render()
    }))
  })
}
function applySettings(next) {
  var previous = JSON.stringify(selected()); settings = next || {}
  maxRows = Math.min(30,Math.max(1,Math.floor(Number(settings.max) || 8)))
  if (selected().indexOf(accountFilter) < 0) accountFilter = ''
  if (previous !== JSON.stringify(selected())) { resetFilter(); resetSubscriptions() } else render()
}
function ready() {
  document.documentElement.lang = Fremkit.locale
  function size(next) { document.documentElement.style.setProperty('--h',next.px.height + 'px'); render() }
  size(Fremkit.size); Fremkit.onResize(size)
  Fremkit.onLocale(function(locale) { document.documentElement.lang = locale; render() })
  document.getElementById('accountFilter').addEventListener('change',function(e) {
    var value = e.target.value
    if (value && selected().indexOf(value) < 0) return
    if (accountFilter === value) return
    accountFilter = value; resetFilter(); resetSubscriptions()
  })
  applySettings(Fremkit.settings); Fremkit.onSettings(applySettings)
  setupActions()
  setInterval(render,30000)
}

function resetFilter() {}
function clearFeedback() { ++actionRevision; feedbackKey=''; feedbackConnectionId='' }
function canOpen(row) { var s=snapshots[row.connectionId]; return !!(s && s.account && s.connectionId===row.connectionId && ageFresh(s) && row.message.open && row.message.open.available===true && row.message.open.reason===null) }
function setupActions() {
  document.getElementById('list').addEventListener('click',function(e) {
    var button=e.target.closest('button[data-action]'); if (!button || button.getAttribute('data-action')!=='open') return
    var id=button.getAttribute('data-connection'), messageId=button.getAttribute('data-id')
    var row=rows().slice(0,maxRows).filter(function(r){return r.connectionId===id && r.message.id===messageId})[0]
    if (!row || !canOpen(row)) return
    clearFeedback(); var epoch=generation, revision=actionRevision, original=snapshots[id]; feedbackKey='opening'; feedbackConnectionId=id; render()
    var result
    try { result=Fremkit.sendCommand(FAMILY+':'+id,'open',{connectionId:id,messageId:messageId}) } catch (_) { result=Promise.reject(new Error('open failed')) }
    Promise.resolve(result).then(function(answer) {
      if (epoch!==generation || snapshots[id]!==original || revision!==actionRevision) return
      feedbackKey=answer && answer.ok===true?'openOk':'openFailed'; render()
    },function(){if(epoch!==generation || snapshots[id]!==original || revision!==actionRevision)return;feedbackKey='openFailed';render()})
  })
}
function rows() {
  var result = []
  active().forEach(function(id) { var snap = snapshots[id]; if (!snap || !Array.isArray(snap.messages)) return
    snap.messages.forEach(function(message) { if (message && typeof message.id === 'string' && message.id) result.push({ connectionId:id, message:message }) })
  })
  return result.sort(function(a,b) {
    var x = a.message.receivedAt, y = b.message.receivedAt
    x = typeof x === 'number' && Number.isFinite(x) ? x : -Infinity
    y = typeof y === 'number' && Number.isFinite(y) ? y : -Infinity
    return (y === x ? 0 : y > x ? 1 : -1) || a.connectionId.localeCompare(b.connectionId) || a.message.id.localeCompare(b.message.id)
  })
}
function render() {
  filters()
  var ids = active(), list = rows(), shown = list.slice(0,maxRows), incomplete = false, more = false
  document.getElementById('accounts').innerHTML = ids.map(function(id) {
    var s = snapshots[id], estimate = s && typeof s.estimatedUnreadCount === 'number' && Number.isFinite(s.estimatedUnreadCount) ? t('estimate',{n:s.estimatedUnreadCount}) : t('estimateUnknown')
    if (!s || !ageFresh(s) || !Array.isArray(s.messages)) incomplete = true
    if (s && s.truncated) more = true
    var empty = s && ageFresh(s) && Array.isArray(s.messages) && !s.messages.length && !s.truncated ? ' · ' + t('empty') : ''
    return '<div class="status" data-state="' + stateKind(s) + '"' + accountStyle(id) + '><strong>' + accountDot() + esc(label(id)) + '</strong><br>' + esc(estimate) + '<br><span class="state">' + esc(state(s) + empty) + '</span></div>'
  }).join('')
  document.getElementById('route').textContent = t(list.some(function(row){return row.message.open && row.message.open.reason==='accountRoutingUnverified'})?'route':'browserHelp')
  var listElement = document.getElementById('list'), activeControl = document.activeElement
  var focus = activeControl && listElement.contains(activeControl) ? ['data-connection','data-id','data-action'].map(function(key) { return activeControl.getAttribute(key) }) : null
  listElement.innerHTML = shown.map(function(row) {
    var m = row.message, snap = snapshots[row.connectionId]
    return '<article class="row" role="listitem"' + accountStyle(row.connectionId) + '><div class="content"><div class="title">' + esc(m.subject || t('subject')) + '</div><div class="sender">' + esc(m.sender || t('sender')) + '</div><div class="meta identity">' + accountDot() + esc(label(row.connectionId)) + '</div><div class="meta">' + esc(typeof m.receivedAt === 'number' && Number.isFinite(m.receivedAt) ? timestamp(m.receivedAt) : t('date')) + (ageFresh(snap) ? '' : ' · ' + esc(t('stale'))) + '</div></div><div class="actions"><button type="button" data-action="open" data-connection="' + esc(row.connectionId) + '" data-id="' + esc(m.id) + '"' + (canOpen(row) ? '' : ' disabled') + '>' + esc(t('open')) + '</button></div></article>'
  }).join('')
  if (focus && focus.every(function(value) { return value !== null })) {
    var buttons = listElement.querySelectorAll('button[data-action]')
    for (var i = 0; i < buttons.length; i++) {
      if (['data-connection','data-id','data-action'].every(function(key,j) { return buttons[i].getAttribute(key) === focus[j] }) && !buttons[i].disabled) { buttons[i].focus({ preventScroll: true }); break }
    }
  }
  var summary = !ids.length ? t('none') : t('shown',{n:shown.length,total:list.length}) + (more ? ' · ' + t('more') : '') + (incomplete ? ' · ' + t('partial') : '')
  document.getElementById('feedback').hidden=!feedbackKey
  document.getElementById('feedback').textContent=feedbackKey?t(feedbackKey):''
  document.getElementById('summary').textContent = summary
  document.getElementById('setup').textContent = t('setup')
  var compact = !ids.length ? t('none') + ' · ' + t('setup') : ids.slice(0,2).map(function(id) {
    var s = snapshots[id]
    return label(id) + ' · ' + (!s ? t('loading') : !Array.isArray(s.messages) ? state(s) : (typeof s.estimatedUnreadCount === 'number' ? t('compactEstimate',{n:s.estimatedUnreadCount}) : t('estimateUnknown')) + (!ageFresh(s) ? ' · ' + t('stale') : '') + (s.error ? ' · ' + t(Object.prototype.hasOwnProperty.call(L,s.error) ? s.error : 'malformed') : ''))
  }).join('\n') + (ids.length > 2 ? ' · ' + t('moreAccounts',{n:ids.length - 2}) : '')
  document.getElementById('compact').textContent = compact
}

Fremkit.whenReady(ready)
</script></body></html>
