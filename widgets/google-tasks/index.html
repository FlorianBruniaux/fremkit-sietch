<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Google Tasks</title><style>
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:transparent;color:var(--on-surface,var(--text,#e6e8eb));font-family:var(--font,-apple-system,system-ui,sans-serif)}[hidden]{display:none!important}

</style></head><body><div class="wrap"><div class="toolbar"><div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="none" stroke="#4285f4" stroke-width="4"/><path d="m8 16 5 5L26 8" fill="none" stroke="#4285f4" stroke-width="4" stroke-linecap="round"/></svg><span>Google Tasks</span></div><div class="filters"><div class="filter"><label for="accountFilter" id="accountLabel"></label><select id="accountFilter"></select></div><div class="filter"><label for="listFilter" id="listLabel"></label><select id="listFilter"></select></div><div class="filter"><label for="stateFilter" id="stateLabel"></label><select id="stateFilter"></select></div></div></div><div id="accounts" role="status"></div><div id="feedback" class="notice" role="status" aria-live="polite" hidden></div><div id="board"></div><div id="summary" class="notice"></div><div id="setup" class="notice"></div></div><div class="cwrap" id="compact"></div><script>
var L={account:{fr:'Compte',en:'Account'},list:{fr:'Liste',en:'List'},state:{fr:'Afficher',en:'Show'},allAccounts:{fr:'Tous les comptes',en:'All accounts'},allLists:{fr:'Toutes les listes',en:'All lists'},pending:{fr:'À faire',en:'To do'},completed:{fr:'Terminées',en:'Completed'},all:{fr:'Toutes les tâches',en:'All tasks'},today:{fr:'Prévues aujourd’hui',en:'Scheduled today'},overdue:{fr:'Date passée',en:'Past scheduled date'},date:{fr:'Prévue le {date}',en:'Scheduled for {date}'},noDate:{fr:'Sans date',en:'No scheduled date'},empty:{fr:'Aucune tâche pour ce filtre',en:'No tasks matching this filter'},noLists:{fr:'Aucune liste',en:'No lists'},none:{fr:'Aucun compte sélectionné',en:'No account selected'},loading:{fr:'Chargement…',en:'Loading…'},unknown:{fr:'Données indisponibles',en:'Data unavailable'},fresh:{fr:'À jour',en:'Up to date'},stale:{fr:'Données anciennes',en:'Stale data'},forbidden:{fr:'Autorisez Google Tasks et activez son API',en:'Authorize Google Tasks and enable its API'},unauthorized:{fr:'Reconnectez ce compte Google',en:'Reconnect this Google account'},unconfigured:{fr:'Compte non configuré',en:'Account not configured'},offline:{fr:'Hors ligne',en:'Offline'},timeout:{fr:'Délai dépassé',en:'Request timed out'},rateLimited:{fr:'Quota atteint',en:'Rate limited'},malformed:{fr:'Données Google invalides',en:'Invalid Google data'},title:{fr:'Sans titre',en:'Untitled'},open:{fr:'Ouvrir sur le Mac',en:'Open on the Mac'},opening:{fr:'Ouverture sur le Mac…',en:'Opening on the Mac…'},opened:{fr:'Tâche ouverte sur le Mac',en:'Task opened on the Mac'},failed:{fr:'Ouverture indisponible, actualisez les données',en:'Opening unavailable, refresh the data'},unsupported:{fr:'Lien direct Google indisponible',en:'Google direct link unavailable'},summary:{fr:'{n} tâches affichées · {lists} listes chargées',en:'{n} tasks shown · {lists} loaded lists'},more:{fr:'Affichage partiel : d’autres listes ou tâches peuvent être disponibles',en:'Partial view: more lists or tasks may be available'},setup:{fr:'Lecture seule · Pour autoriser Tasks : Administration → Connexions → compte Google → Google Tasks → Reconnecter avec Google. Ouvrir affiche la tâche dans le navigateur du Mac.',en:'Read only · To authorize Tasks: Admin → Connections → Google account → Google Tasks → Reconnect with Google. Open displays the task in the Mac browser.'},filterUnavailable:{fr:'La liste sélectionnée est indisponible',en:'The selected list is unavailable'}}
var settings={},snapshots=Object.create(null),unsubs=[],generation=0,revision=0,accountFilter='',listFilter='',stateFilter='pending',feedback=''
function t(k,p){return Fremkit.t(L[k],p)}function esc(v){return Fremkit.esc(v==null?'':v)}
function selected(){return Array.isArray(settings.accounts)?settings.accounts.filter(function(v,i,a){return typeof v==='string'&&v&&a.indexOf(v)===i}).slice(0,50):[]}
function active(){return selected().filter(function(id){return !accountFilter||id===accountFilter})}
function label(id){var s=snapshots[id];return s&&s.account&&s.account.email||id}
function color(id){var c=snapshots[id]&&snapshots[id].account&&snapshots[id].account.color;return /^#[0-9a-f]{6}$/i.test(c||'')?c:'#4285f4'}
function style(id){return ' style="--account-color:'+color(id)+'"'}
function fresh(s){return !!(s&&s.freshness==='fresh'&&!s.error&&Number.isFinite(s.updatedAt)&&Date.now()>=s.updatedAt&&Date.now()-s.updatedAt<=120000)}
function status(s){if(!s)return t('loading');return [s.error?t(L[s.error]?s.error:'malformed'):null,s.freshness==='stale'||s.freshness==='fresh'&&!fresh(s)?t('stale'):fresh(s)?t('fresh'):t('unknown')].filter(Boolean).join(' · ')}
function lists(id){var s=snapshots[id];return s&&Array.isArray(s.lists)?s.lists.filter(function(l){return l&&typeof l.id==='string'&&l.id}):[]}
function loaded(){var result=[];active().forEach(function(id){lists(id).forEach(function(l){result.push({id:id,list:l,key:JSON.stringify([id,l.id])})})});return result}
function today(){var d=new Date(Date.now());return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function matches(task){return stateFilter==='all'||stateFilter==='pending'&&task.status==='needsAction'||stateFilter==='completed'&&task.status==='completed'||stateFilter==='today'&&task.status==='needsAction'&&task.dueDate===today()||stateFilter==='overdue'&&task.status==='needsAction'&&task.dueDate&&task.dueDate<today()}
function tasks(l){return Array.isArray(l.tasks)?l.tasks.filter(function(task){return task&&typeof task.id==='string'&&['needsAction','completed'].indexOf(task.status)>=0&&matches(task)}):[]}
function date(v){if(!/^\d{4}-\d{2}-\d{2}$/.test(v||''))return '';return new Intl.DateTimeFormat(Fremkit.locale==='fr'?'fr-FR':'en-GB',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'}).format(new Date(v+'T00:00:00Z'))}
function options(id,items,value){var el=document.getElementById(id);el.innerHTML=items.map(function(x){return '<option value="'+esc(x[0])+'">'+esc(x[1])+'</option>'}).join('');el.value=value}
function enabled(row,task){return fresh(snapshots[row.id])&&fresh(row.list)&&task.open&&task.open.available===true&&task.open.reason===null}
function render(){
 var rows=loaded();if(listFilter&&!rows.some(function(r){return r.key===listFilter})){listFilter='';feedback=t('filterUnavailable');revision++}
 options('accountFilter',[['',t('allAccounts')]].concat(selected().map(function(id){return [id,label(id)]})),accountFilter)
 options('listFilter',[['',t('allLists')]].concat(rows.map(function(r){return [r.key,(r.list.title||t('title'))+' · '+label(r.id)]})),listFilter)
 options('stateFilter',['pending','completed','all','today','overdue'].map(function(k){return [k,t(k)]}),stateFilter)
 document.getElementById('accountLabel').textContent=t('account');document.getElementById('listLabel').textContent=t('list');document.getElementById('stateLabel').textContent=t('state')
 document.getElementById('accounts').innerHTML=active().map(function(id){var s=snapshots[id];return '<div class="account"'+style(id)+'><strong>'+esc(label(id))+'</strong><div'+(s&&s.error?' class="error"':'')+'>'+esc(status(s))+'</div></div>'}).join('')
 var shown=rows.filter(function(r){return !listFilter||listFilter===r.key}),count=0
 document.getElementById('board').innerHTML=shown.map(function(row){var l=row.list,items=tasks(l);count+=items.length;return '<section class="column"'+style(row.id)+' aria-label="'+esc((l.title||t('title'))+' · '+label(row.id))+'"><header><span class="counter">'+esc(l.tasks===null?'?':items.length+(l.truncated?'+':''))+'</span><h2>'+esc(l.title||t('title'))+'</h2><div class="meta">'+esc(label(row.id))+'</div><div class="meta">'+esc(status(l))+'</div></header><div class="items" role="list">'+(items.length?items.map(function(task){var due=task.dueDate,cls=task.status==='completed'?'done':due&&due<today()?'overdue':due===today()?'today':'';return '<article class="task '+cls+(task.parent?' child':'')+'" role="listitem"><span class="task-icon" aria-hidden="true">'+(task.status==='completed'?'✓':'○')+'</span><div class="content"><div class="title">'+esc(task.title||t('title'))+'</div><div class="due">'+esc(due?t('date',{date:date(due)}):t('noDate'))+'</div>'+(task.notes?'<div class="notes">'+esc(task.notes)+'</div>':'')+'</div><button type="button" data-connection="'+esc(row.id)+'" data-list="'+esc(l.id)+'" data-task="'+esc(task.id)+'" aria-label="'+esc(t('open')+' : '+(task.title||t('title')))+'" title="'+esc(enabled(row,task)?t('open'):!fresh(l)?t('stale'):t('unsupported'))+'"'+(enabled(row,task)?'':' disabled')+'>↗</button></article>'}).join(''):'<div class="empty">'+esc(fresh(l)&&Array.isArray(l.tasks)?t('empty'):t('unknown'))+'</div>')+'</div></section>'}).join('')
 if(!shown.length)document.getElementById('board').innerHTML='<div class="empty">'+esc(!selected().length?t('none'):active().every(function(id){return fresh(snapshots[id])&&Array.isArray(snapshots[id].lists)})?t('noLists'):t('unknown'))+'</div>'
 var more=active().some(function(id){var s=snapshots[id];return s&&s.truncated})||shown.some(function(r){return r.list.truncated})
 document.getElementById('summary').textContent=t('summary',{n:count,lists:shown.length})+(more?' · '+t('more'):'')
 document.getElementById('setup').textContent=t('setup');document.getElementById('feedback').textContent=feedback;document.getElementById('feedback').hidden=!feedback;document.getElementById('compact').textContent='Google Tasks · '+count+' · '+active().map(function(id){return label(id)+': '+status(snapshots[id])}).join(' · ')
}
function applySettings(value){var old=JSON.stringify(selected());settings=value||{};if(selected().indexOf(accountFilter)<0)accountFilter='';if(old===JSON.stringify(selected())){render();return}var token=++generation;revision++;feedback='';listFilter='';unsubs.forEach(function(off){off()});unsubs=[];snapshots=Object.create(null);render();selected().forEach(function(id){unsubs.push(Fremkit.subscribe('google-tasks:'+id,function(s){if(token!==generation||selected().indexOf(id)<0)return;revision++;feedback='';if(s&&s.connectionId===id)snapshots[id]=s;else delete snapshots[id];render()}))})}
Fremkit.whenReady(function(){document.documentElement.lang=Fremkit.locale;Fremkit.onLocale(function(l){document.documentElement.lang=l;render()});Fremkit.onSettings(applySettings);applySettings(Fremkit.settings)
 ;['accountFilter','listFilter','stateFilter'].forEach(function(id){document.getElementById(id).addEventListener('change',function(e){var v=e.target.value;if(id==='accountFilter'){if(v&&selected().indexOf(v)<0)return;accountFilter=v;listFilter=''}else if(id==='listFilter'){if(v&&!loaded().some(function(r){return r.key===v}))return;listFilter=v}else{if(['pending','completed','all','today','overdue'].indexOf(v)<0)return;stateFilter=v}revision++;feedback='';render()})})
 document.getElementById('board').addEventListener('click',async function(e){var button=e.target.closest('button[data-task]');if(!button)return;var id=button.getAttribute('data-connection'),listId=button.getAttribute('data-list'),taskId=button.getAttribute('data-task'),row=loaded().find(function(r){return r.id===id&&r.list.id===listId&&(!listFilter||r.key===listFilter)}),task=row&&tasks(row.list).find(function(t){return t.id===taskId});if(!row||!task||!enabled(row,task))return;var token=++revision;feedback=t('opening');render();try{var result=await Fremkit.sendCommand('google-tasks:'+id,'open',{connectionId:id,listId:listId,taskId:taskId});if(token!==revision)return;feedback=t(result&&result.ok===true?'opened':'failed')}catch(_){if(token!==revision)return;feedback=t('failed')}render()})
 setInterval(render,30000)
})
</script></body></html>
