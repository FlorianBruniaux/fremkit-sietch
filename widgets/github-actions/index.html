<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>GitHub Actions</title>
<style>
  html,body{margin:0;height:100%;background:transparent;color:var(--text, #e6e8eb);font-family:var(--font, -apple-system,system-ui,sans-serif);overflow:hidden}
  .wrap{box-sizing:border-box;height:100%;padding:12px 16px;display:flex;flex-direction:column;gap:6px}
  .note{font-size:calc(13px * var(--text-scale, 1));color:var(--text-muted, #8b93a0);letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  [hidden]{display:none!important}
  html.on-light body{color:var(--on-surface,#0b0d10)}
  html.on-light .note{color:var(--on-surface,#0b0d10);opacity:.75}

  .banner{flex:0 0 auto;font-size:calc(12px * var(--text-scale, 1));letter-spacing:.06em;color:#f0a020;background:rgba(240,160,32,.12);border-radius:8px;padding:4px 8px}
  .banner.bad{color:var(--danger, #d9463f);background:rgba(217,70,63,.12)}
  .scroll{flex:1;min-height:0;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;
    display:flex;flex-direction:column;gap:6px;padding-right:4px}
  .stale{opacity:.55}
  /* Finger-sized rows, running and finished alike: 40 px is the touch minimum. */
  .row{border:0;font:inherit;color:inherit;text-align:left;width:100%;cursor:pointer;display:flex;align-items:center;gap:10px;min-height:40px;padding:6px 10px;border-radius:10px;
    background:rgba(128,128,128,.08)}
  .row:focus-visible{outline:2px solid var(--accent,#d9b36a)}
  .row.live{background:var(--surface-2, #1a1e24)}
  html.on-light .row.live{background:rgba(128,128,128,.18)}
  .dot{flex:0 0 auto;width:11px;height:11px;border-radius:6px;background:var(--text-dim, #5f6771)}
  .dot.success{background:var(--ok, #2fb36b)}.dot.failure{background:var(--danger, #d9463f)}.dot.cancelled{background:var(--text-dim, #5f6771)}
  .dot.timed_out{background:var(--danger, #d9463f)}.dot.action_required{background:#f0a020}.dot.neutral{background:var(--text-muted, #8b93a0)}
  .dot.skipped{background:repeating-linear-gradient(135deg,var(--border-strong, #3a404a) 0 4px,var(--surface-3, #252a32) 4px 8px)}
  .dot.queued{background:var(--text-muted, #8b93a0)}
  .dot.running{background:var(--accent,#d9b36a);animation:pulse 1.1s ease-in-out infinite alternate}
  @keyframes pulse{from{opacity:.35}to{opacity:1}}
  .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
  .title{font-size:calc(14px * var(--text-scale, 1));font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sub{font-size:calc(11px * var(--text-scale, 1));color:var(--text-muted, #8b93a0);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  html.on-light .sub{color:var(--on-surface,#0b0d10);opacity:.7}
  .when{flex:0 0 auto;font-size:calc(12px * var(--text-scale, 1));color:var(--text-muted, #8b93a0);font-variant-numeric:tabular-nums}
  html.on-light .when{color:var(--on-surface,#0b0d10);opacity:.7}

/* Large touch targets and readable hierarchy on the Edge; action handlers are unchanged. */
html:not(.compact) .row{min-height:56px;flex-shrink:0;padding:10px 12px}html:not(.compact) .title{font-size:calc(18px * var(--text-scale,1));line-height:1.3}html:not(.compact) .sub,html:not(.compact) .when{font-size:calc(14px * var(--text-scale,1));line-height:1.3}.head button{min-height:56px;font-size:calc(15px * var(--text-scale,1))}.head .counts{font-size:calc(15px * var(--text-scale,1))}.sect{font-size:calc(13px * var(--text-scale,1))}

  .service-head{display:flex;align-items:center;gap:12px;flex:0 0 auto;padding:4px 0 6px}.service-head h2{margin:0;font-size:calc(24px * var(--text-scale,1));line-height:1.2}.service-icon{width:30px;height:30px;flex:none;color:var(--text,#e6e8eb)}html.on-light .service-icon{color:var(--on-surface,#0b0d10)}html.compact .service-head{display:none}

  .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;flex:0 0 auto}.stat{border:1px solid var(--border,#464c56);border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:12px;min-width:0}.stat svg{width:28px;height:28px;flex:none}.stat .number{display:block;font-size:calc(28px * var(--text-scale,1));font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}.stat .label{display:block;font-size:calc(15px * var(--text-scale,1));line-height:1.3;color:var(--text-muted,#8b93a0)}.stat.running svg,.status-symbol.running{color:var(--accent,#d9b36a)}.stat.queued svg,.status-symbol.queued{color:var(--text-muted,#8b93a0)}.stat.success svg,.status-symbol.success{color:var(--ok,#2fb36b)}.stat.failure svg,.status-symbol.failure,.status-symbol.timed_out{color:var(--danger,#d9463f)}.status-symbol{display:flex;align-items:center;flex:none;width:28px;height:28px;color:var(--text-muted,#8b93a0)}.status-symbol svg{width:100%;height:100%}.status-symbol.action_required{color:var(--accent,#d9b36a)}.run-state{font-weight:650;margin-right:8px;color:var(--text,#e6e8eb)}html.on-light .run-state{color:var(--on-surface,#0b0d10)}.summary-note{flex:0 0 auto;font-size:calc(14px * var(--text-scale,1));color:var(--text-muted,#8b93a0);line-height:1.3}html.compact .stats,html.compact .summary-note{display:none}
  @media(max-width:600px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat{padding:8px}.stat .number{font-size:calc(24px * var(--text-scale,1))}}

  .filters{display:grid;grid-template-columns:1fr 1.5fr;gap:10px;flex:0 0 auto}.filters label{display:flex;flex-direction:column;gap:4px;min-width:0;font-size:13px;color:var(--text-muted,#8b93a0)}.filters select{box-sizing:border-box;width:100%;min-height:56px;padding:8px 12px;border:1px solid var(--border,#464c56);border-radius:8px;background:var(--surface-2,#1c2128);color:var(--on-surface,var(--text,#e6e8eb));font:inherit;font-size:15px}.filters select:focus-visible{outline:2px solid var(--accent,#d9b36a);outline-offset:2px}.filter-note{flex:0 0 auto;font-size:12px;color:var(--text-muted,#8b93a0)}html.compact .filters,html.compact .filter-note{display:none!important}
</style></head>
<body><div class="wrap">
  <div class="service-head"><svg class="service-icon" aria-hidden="true" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg><h2>GitHub Actions</h2></div>
  <div class="filters" id="filters" hidden><label><span id="ownerLabel"></span><select id="ownerFilter" aria-labelledby="ownerLabel"></select></label><label><span id="repoLabel"></span><select id="repoFilter" aria-labelledby="repoLabel"></select></label></div>
  <div class="filter-note" id="filterNote" hidden></div>
  <div class="banner" id="banner" hidden></div>
  <div class="banner bad" id="openError" hidden></div>
  <div class="stats" id="stats" hidden><div class="stat running"><svg aria-hidden="true" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m10 8 6 4-6 4Z"/></svg><div><span class="number" id="runningCount">?</span><span class="label" id="runningLabel"></span></div></div><div class="stat queued"><svg aria-hidden="true" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/></svg><div><span class="number" id="queuedCount">?</span><span class="label" id="queuedLabel"></span></div></div><div class="stat success"><svg aria-hidden="true" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg><div><span class="number" id="successCount">?</span><span class="label" id="successLabel"></span></div></div><div class="stat failure"><svg aria-hidden="true" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m9 9 6 6m0-6-6 6"/></svg><div><span class="number" id="failureCount">?</span><span class="label" id="failureLabel"></span></div></div></div><div class="summary-note" id="summaryNote" hidden></div>
  <div class="scroll" id="scroll"></div>
  <div class="note" id="empty" hidden></div>
</div>
<script>
  var L = {
    ownerLabel: {fr:'Organisation / compte',en:'Organization / account'},
    repoLabel: {fr:'Dépôt',en:'Repository'},
    allOwners: {fr:'Toutes les organisations / comptes',en:'All organizations / accounts'},
    allRepos: {fr:'Tous les dépôts',en:'All repositories'},
    filterNote: {fr:'Filtres sur les éléments chargés',en:'Filters apply to loaded items'},
    filteredEmpty: {fr:'Aucun élément chargé pour ce filtre',en:'No loaded items match this filter'},

    runningLabel: {"fr": "En cours", "en": "Running"},
    queuedLabel: {"fr": "En attente", "en": "Queued"},
    successLabel: {"fr": "Réussies", "en": "Succeeded"},
    failureLabel: {"fr": "Échouées", "en": "Failed"},
    summary: {"fr": "{total} exécutions chargées · {shown} affichées", "en": "{total} loaded runs · {shown} shown"},
    summaryUnknown: {"fr": "Compteurs indisponibles · données précédentes si présentes", "en": "Counters unavailable · previous data if present"},
    state_running: {"fr": "En cours", "en": "Running"},
    state_queued: {"fr": "En attente", "en": "Queued"},
    state_success: {"fr": "Réussi", "en": "Succeeded"},
    state_failure: {"fr": "Échoué", "en": "Failed"},
    state_timed_out: {"fr": "Délai dépassé", "en": "Timed out"},
    state_cancelled: {"fr": "Annulé", "en": "Cancelled"},
    state_skipped: {"fr": "Ignoré", "en": "Skipped"},
    state_action_required: {"fr": "Action requise", "en": "Action required"},
    state_neutral: {"fr": "Neutre", "en": "Neutral"},
    state_stale: {"fr": "Expiré", "en": "Expired"},
    state_unknown: {"fr": "État inconnu", "en": "Unknown status"},

    openFailed: { fr: 'Impossible d’ouvrir cette page sur le Mac', en: 'Could not open this page on the Mac' },
    agoSeconds: { fr: 'il y a {n} s', en: '{n} s ago' },
    agoMinutes: { fr: 'il y a {n} min', en: '{n} min ago' },
    agoHours: { fr: 'il y a {n} h', en: '{n} h ago' },
    agoDays: { fr: 'il y a {n} j', en: '{n} d ago' },
    elapsedMinutes: { fr: '{m} min {s} s', en: '{m} min {s} s' },
    elapsedSeconds: { fr: '{s} s', en: '{s} s' },
    queued: { fr: 'en file', en: 'queued' },
    noConnection: { fr: 'Connexion manquante', en: 'No connection' },
    loading: { fr: 'Chargement…', en: 'Loading…' },
    unauthorized: { fr: 'Jeton refusé', en: 'Token refused' },
    rateLimited: { fr: 'Quota GitHub épuisé', en: 'GitHub quota exhausted' },
    unconfigured: { fr: 'Connexion incomplète', en: 'Connection incomplete' },
    offline: { fr: 'Hors ligne', en: 'Offline' },
    /* The runs source alone failed: the rest of the snapshot is fine, this line says why. */
    errForbidden: { fr: 'Pas d’accès aux dépôts avec ce jeton', en: 'No access to the repositories with this token' },
    errNotFound: { fr: 'Dépôt introuvable ou inaccessible à ce jeton', en: 'Repository not found or not accessible by this token' },
    errRateLimited: { fr: 'Quota atteint', en: 'Rate limited' },
    empty: { fr: 'Aucun run récent', en: 'No recent run' },
    noRepos: { fr: 'Aucun dépôt : renseignez « Dépôts » sur la connexion', en: 'No repository: fill in “Repositories” on the connection' }
  }
  var ERRORS = { unauthorized: L.unauthorized, 'rate-limited': L.rateLimited, unconfigured: L.unconfigured, offline: L.offline }
  var RUNS_ERRORS = { forbidden: L.errForbidden, 'not-found': L.errNotFound, 'rate-limited': L.errRateLimited, unauthorized: L.unauthorized, offline: L.offline }

  var snapshot = null, channel = null, unsub = null, repos = [], runningMax = 4, historyMax = 8


  // A repository owner can be a personal account or an organization. Never infer its type.
  var ownerFilter = '', repoFilter = ''
  function ownerOf(repo) { return String(repo || '').split('/')[0] }
  function matchesFilter(item) { return (!ownerFilter || ownerOf(item.repo).toLowerCase() === ownerFilter.toLowerCase()) && (!repoFilter || String(item.repo).toLowerCase() === repoFilter.toLowerCase()) }
  function hasFilter() { return !!ownerFilter || !!repoFilter }
  function filterOptions(id, values, chosen, allLabel) {
    var select = document.getElementById(id)
    values = Array.from(new Set(values.filter(Boolean))).sort(function(a,b){return a.localeCompare(b)})
    // Keep an explicit selection when a poll has no matching rows, rather than silently showing everything.
    if (chosen && values.indexOf(chosen) === -1) values.push(chosen)
    var options = '<option value=""'+(!chosen?' selected':'')+'>'+Fremkit.esc(Fremkit.t(allLabel))+'</option>' + values.map(function(value){return '<option value="'+Fremkit.esc(value)+'"'+(value===chosen?' selected':'')+'>'+Fremkit.esc(value)+'</option>'}).join('')
    if (select.innerHTML !== options) select.innerHTML = options
    select.value = chosen
  }
  function renderFilters(items, configured) {
    var repoNames = (configured || []).concat(items.map(function(item){return item.repo})).filter(Boolean)
    document.getElementById('filters').hidden = !snapshot || !channel
    document.getElementById('filterNote').hidden = !snapshot || !channel
    document.getElementById('ownerLabel').textContent = Fremkit.t(L.ownerLabel)
    document.getElementById('repoLabel').textContent = Fremkit.t(L.repoLabel)
    document.getElementById('filterNote').textContent = Fremkit.t(L.filterNote)
    filterOptions('ownerFilter',repoNames.map(ownerOf),ownerFilter,L.allOwners)
    filterOptions('repoFilter',repoNames.filter(function(repo){return !ownerFilter || ownerOf(repo).toLowerCase()===ownerFilter.toLowerCase()}),repoFilter,L.allRepos)
  }
  function bindFilters() {
    document.getElementById('ownerFilter').addEventListener('change',function(event){ownerFilter=event.target.value;repoFilter='';render()})
    document.getElementById('repoFilter').addEventListener('change',function(event){repoFilter=event.target.value;render()})
  }

  function ago(ms) {
    var s = Math.max(0, Math.round(ms / 1000))
    if (s < 60) return Fremkit.t(L.agoSeconds, { n: s })
    var m = Math.floor(s / 60)
    if (m < 60) return Fremkit.t(L.agoMinutes, { n: m })
    var h = Math.floor(m / 60)
    if (h < 24) return Fremkit.t(L.agoHours, { n: h })
    return Fremkit.t(L.agoDays, { n: Math.floor(h / 24) })
  }
  function elapsed(ms) {
    var s = Math.max(0, Math.round(ms / 1000)), m = Math.floor(s / 60)
    return m ? Fremkit.t(L.elapsedMinutes, { m: m, s: String(s % 60).padStart(2, '0') }) : Fremkit.t(L.elapsedSeconds, { s: s })
  }
  /* An empty repository list means "every repository the connection reads", not "none". */
  function selected(run) { return !repos.length || repos.indexOf(run.repo) !== -1 }


  // Closed local icon table: no external image, font or markup from the provider.
  var STATUS_ICONS = {"running": "<svg aria-hidden=\"true\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"m10 8 6 4-6 4Z\"/></svg>", "queued": "<svg aria-hidden=\"true\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 6v6l4 2\"/></svg>", "success": "<svg aria-hidden=\"true\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"m8 12 3 3 5-6\"/></svg>", "failure": "<svg aria-hidden=\"true\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"m9 9 6 6m0-6-6 6\"/></svg>", "timed_out": "<svg aria-hidden=\"true\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 6v6l4 2\"/></svg>", "cancelled": "<svg aria-hidden=\"true\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M8 12h8\"/></svg>", "skipped": "<svg aria-hidden=\"true\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M9 8v8l5-4Zm6 0v8\"/></svg>", "action_required": "<svg aria-hidden=\"true\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m12 3 10 18H2Z\"/><path d=\"M12 9v5m0 3h.01\"/></svg>", "neutral": "<svg aria-hidden=\"true\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M8 12h8\"/></svg>", "stale": "<svg aria-hidden=\"true\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 6v6l4 2\"/></svg>", "unknown": "<svg aria-hidden=\"true\" viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"3\"/></svg>"}
  function statusIcon(key){return Object.prototype.hasOwnProperty.call(STATUS_ICONS,key)?STATUS_ICONS[key]:STATUS_ICONS.unknown}
  function statusLabel(key){return Fremkit.t(Object.prototype.hasOwnProperty.call(L,'state_'+key)?L['state_'+key]:L.state_unknown)}
  function renderSummary(all, shown, available) {
    var keys=['running','queued','success','failure']
    var counts={running:0,queued:0,success:0,failure:0}
    all.forEach(function(r){if(r.status==='running')counts.running++;else if(r.status==='queued')counts.queued++;else if(r.status==='completed'&&r.conclusion==='success')counts.success++;else if(r.status==='completed'&&(r.conclusion==='failure'||r.conclusion==='timed_out'))counts.failure++})
    keys.forEach(function(key){document.getElementById(key+'Count').textContent=available?String(counts[key]):'?';document.getElementById(key+'Label').textContent=Fremkit.t(L[key+'Label'])})
    document.getElementById('stats').hidden=false
    document.getElementById('summaryNote').hidden=false
    document.getElementById('summaryNote').textContent=available?Fremkit.t(L.summary,{total:all.length,shown:shown}):Fremkit.t(L.summaryUnknown)
  }

  function row(run, now, live) {
    var cls = live ? (run.status === 'queued' ? 'queued' : 'running') : (run.conclusion || '')
    var right = live
      ? (run.status === 'queued' ? Fremkit.t(L.queued) : elapsed(now - (run.startedAt || now)))
      : ago(now - (run.updatedAt || run.startedAt || now))
    return '<button type="button" class="row' + (live ? ' live' : '') + '" data-kind="run" data-id="' + Fremkit.esc(run.id) + '">' +
      '<span class="status-symbol ' + Fremkit.esc(cls) + '">' + statusIcon(cls) + '</span>' +
      '<span class="body"><span class="title">' + Fremkit.esc(run.name) + '</span>' +
      '<span class="sub"><span class="run-state">' + Fremkit.esc(statusLabel(cls)) + '</span> ' + Fremkit.esc(run.repo) + ' · ' + Fremkit.esc(run.branch) +
      (run.actor ? ' · ' + Fremkit.esc(run.actor) : '') + (run.event ? ' · ' + Fremkit.esc(run.event) : '') + '</span></span>' +
      '<span class="when">' + Fremkit.esc(right) + '</span></button>'
  }

  var openErrorUntil = 0
  function openRow(row) {
    if (!channel || !row) return
    var id = row.getAttribute('data-id'), kind = row.getAttribute('data-kind')
    if (!id || !kind) return
    Promise.resolve(Fremkit.sendCommand(channel, 'open', { kind: kind, id: id }))
      .then(function (result) { if (!result || !result.ok) throw new Error('open failed') })
      .catch(function () { openErrorUntil = Date.now() + 5000; render() })
  }
  function render() {
    var openError = document.getElementById('openError')
    openError.hidden = Date.now() >= openErrorUntil
    openError.textContent = Fremkit.t(L.openFailed)
    renderFilters((snapshot && snapshot.runs || []).filter(selected), repos)
    document.getElementById('stats').hidden = true
    document.getElementById('summaryNote').hidden = true
    var banner = document.getElementById('banner'), scroll = document.getElementById('scroll'), empty = document.getElementById('empty')
    if (!channel) {
      banner.hidden = false; banner.className = 'banner bad'; banner.textContent = Fremkit.t(L.noConnection)
      scroll.hidden = true; empty.hidden = true; return
    }
    if (!snapshot) {
      banner.hidden = true; scroll.hidden = true; empty.hidden = false; empty.textContent = Fremkit.t(L.loading); return
    }
    scroll.hidden = false
    var err = snapshot.error
    var runsErr = !err && snapshot.errors && snapshot.errors.runs
    banner.hidden = !err && !runsErr
    if (err) {
      banner.className = 'banner' + (err === 'unauthorized' || err === 'unconfigured' ? ' bad' : '')
      banner.textContent = Fremkit.t(ERRORS[err] || L.offline)
    } else if (runsErr) {
      banner.className = 'banner' + (runsErr === 'not-found' || runsErr === 'forbidden' ? ' bad' : '')
      banner.textContent = Fremkit.t(RUNS_ERRORS[runsErr] || L.offline)
    }
    scroll.classList.toggle('stale', !!err || !!runsErr)

    var now = Date.now()
    var all = (snapshot.runs || []).filter(selected).filter(matchesFilter)
    var live = all.filter(function (r) { return r.status !== 'completed' }).slice(0, runningMax)
    var done = all.filter(function (r) { return r.status === 'completed' }).slice(0, historyMax)
    renderSummary(all, live.length + done.length, !err && !runsErr)
    scroll.innerHTML =
      live.map(function (r) { return row(r, now, true) }).join('') +
      done.map(function (r) { return row(r, now, false) }).join('')
    empty.hidden = live.length + done.length > 0
    // An empty snapshot with nothing configured on the connection deserves a clearer line.
    empty.textContent = Fremkit.t(hasFilter() ? L.filteredEmpty : (snapshot.runs || []).length ? L.empty : L.noRepos)
  }

  function applySettings(s) {
    repos = Array.isArray(s.repos) ? s.repos.slice() : []
    runningMax = Number(s.max) > 0 ? Number(s.max) : 4
    historyMax = Number(s.history) > 0 ? Number(s.history) : 8
    var next = s.connection ? 'github:' + s.connection : null
    if (next !== channel) {
      if (unsub) { unsub(); unsub = null }
      snapshot = null
      ownerFilter = ''; repoFilter = ''
      channel = next
      if (channel) unsub = Fremkit.subscribe(channel, function (d) { snapshot = d; render() })
    }
    render()
  }

  Fremkit.whenReady(function () {
    document.documentElement.lang = Fremkit.locale
    bindFilters()
    Fremkit.onLocale(function (locale) { document.documentElement.lang = locale; render() })
    applySettings(Fremkit.settings)
    Fremkit.onSettings(function (next) { applySettings(next || {}) })
    document.getElementById('scroll').addEventListener('click', function (e) { openRow(e.target.closest('.row')) })
    setInterval(function () {
      document.getElementById('openError').hidden = Date.now() >= openErrorUntil
      if (!snapshot) return
      var now = Date.now(), byId = {}
      ;(snapshot.runs || []).forEach(function (run) { byId[run.id] = run })
      // Preserve the button under the finger; only its timer text changes between snapshots.
      document.getElementById('scroll').querySelectorAll('.row').forEach(function (button) {
        var run = byId[button.getAttribute('data-id')]
        if (!run) return
        button.querySelector('.when').textContent = run.status !== 'completed'
          ? (run.status === 'queued' ? Fremkit.t(L.queued) : elapsed(now - (run.startedAt || now)))
          : ago(now - (run.updatedAt || run.startedAt || now))
      })
    }, 1000)
  })
</script></body></html>
