<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mac temperatures</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; color: var(--on-surface, var(--text, #e6e8eb)); font-family: var(--font, system-ui, sans-serif); overflow: hidden; }
    * { box-sizing: border-box; }
    .wrap { height: 100%; padding: 12px; display: flex; flex-direction: column; justify-content: center; gap: 8px; }
    .value { font-size: calc(46px * var(--text-scale, 1)); font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; line-height: 1; }
    .unit { font-size: .5em; font-weight: 400; }
    .source, .status, .label { font-size: calc(12px * var(--text-scale, 1)); color: var(--text-muted, currentColor); line-height: 1.35; }
    .status:empty { display: none; }
    html.on-light .source, html.on-light .status { color: var(--on-surface, #0b0d10); opacity: .75; }
    html.compact .wrap { padding: 0 8px; align-items: center; flex-direction: row; justify-content: center; gap: 6px; }
    html.compact .value { font-size: calc(var(--h, 80px) * .36 * var(--text-scale, 1)); }
    html.compact .source { display: none; }
    html.compact .label { white-space: nowrap; }
    html.compact .status { display: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="label" id="label"></div>
    <div class="value"><span id="cpu">?</span><span class="unit"> °C</span></div>
    <div class="source" id="source"></div>
    <div class="status" id="status" role="status"></div>
  </div>
  <script>
    var L = {
      cpu: { fr: 'CPU', en: 'CPU' },
      macmon: { fr: 'Source : macmon', en: 'Source: macmon' },
      system: { fr: 'Source : capteur système', en: 'Source: system sensor' },
      loading: { fr: 'Chargement…', en: 'Loading…' },
      unconfigured: { fr: 'Installer macmon : brew install macmon', en: 'Install macmon: brew install macmon' },
      unsupported: { fr: 'Apple Silicon uniquement', en: 'Apple Silicon only' },
      unavailable: { fr: 'Mesure indisponible', en: 'Reading unavailable' },
      optIn: { fr: 'Activer « Lire la température du CPU avec macmon » dans Réglages de l’écran → Confidentialité (Fremkit 0.3.0)', en: 'Enable “Read the CPU temperature with macmon” in Screen settings → Privacy (Fremkit 0.3.0)' }
    };

    var snapshot = null;

    function valid(value) {
      return typeof value === 'number' && Number.isFinite(value) && value > 0 && value < 150;
    }

    function label(key) {
      return Fremkit.t(L[key]);
    }

    function render() {
      document.documentElement.lang = Fremkit.locale;
      document.getElementById('label').textContent = label('cpu');
      var cpu = snapshot && snapshot.cpu;
      var value = cpu && cpu.temp;
      var source = cpu && cpu.tempSource;
      var error = cpu && cpu.tempError;
      document.getElementById('cpu').textContent = valid(value)
        ? new Intl.NumberFormat(Fremkit.locale, { maximumFractionDigits: 1 }).format(value)
        : '?';
      document.getElementById('source').textContent = valid(value) && (source === 'macmon' || source === 'system')
        ? label(source) : '';
      document.getElementById('status').textContent = !snapshot ? label('loading')
        : error === 'unconfigured' ? label('unconfigured')
        : error === 'unsupported' ? label('unsupported')
        : (error === 'offline' || error === 'invalid') && !valid(value) ? label('unavailable')
        : !valid(value) ? label('optIn') : '';
    }

    Fremkit.whenReady(function () {
      document.documentElement.style.setProperty('--h', Fremkit.size.px.height + 'px');
      Fremkit.subscribe('system', function (data) { snapshot = data; render(); });
      Fremkit.onLocale(render);
      Fremkit.onResize(function () {
        document.documentElement.style.setProperty('--h', Fremkit.size.px.height + 'px');
      });
      render();
    });
  </script>
</body>
</html>
