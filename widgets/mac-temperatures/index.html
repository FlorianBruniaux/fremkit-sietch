<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mac temperatures</title><style>
html,body{margin:0;height:100%;background:transparent;color:var(--on-surface,var(--text,#e6e8eb));font-family:var(--font,system-ui,sans-serif);overflow:hidden}*{box-sizing:border-box}.wrap{height:100%;padding:14px;display:flex;flex-direction:column;justify-content:center;gap:12px}.heading{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600}.heading svg{width:22px;height:22px;color:var(--accent,#d9b36a)}.sensors{display:grid;grid-template-columns:1fr 1fr;gap:12px}.label{font-size:13px;color:var(--text-muted,#8b93a0)}.value{font-size:calc(32px * var(--text-scale,1));font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}.unit{font-size:18px;font-weight:400}.note{font-size:11px;color:var(--text-muted,#8b93a0);line-height:1.4}html.on-light .label,html.on-light .note{color:var(--on-surface,#0b0d10);opacity:.75}html.accent-fill .heading svg{color:var(--on-surface,#0b0d10)}[hidden]{display:none!important}@media(max-width:340px){.value{font-size:28px}.wrap{padding:12px;gap:10px}}
</style></head><body><div class="wrap"><div class="heading"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M9 14.5V5a3 3 0 0 1 6 0v9.5a5 5 0 1 1-6 0Z"/><path d="M12 8v10m5-11h3m-3 4h3"/></svg><span id="heading"></span></div><div class="sensors"><div><div class="label">CPU</div><div class="value"><span id="cpu">?</span><span class="unit"> °C</span></div></div><div><div class="label">GPU</div><div class="value"><span id="gpu">?</span><span class="unit"> °C</span></div></div></div><div class="note" id="status" role="status"></div></div><script>
var L={heading:{fr:'Températures',en:'Temperatures'},loading:{fr:'Chargement…',en:'Loading…'},average:{fr:'Moyennes des capteurs · {time}',en:'Sensor averages · {time}'},unconfigured:{fr:'macmon non installé',en:'macmon not installed'},unsupported:{fr:'Mesure Apple Silicon indisponible',en:'Apple Silicon reading unavailable'},offline:{fr:'Capteurs indisponibles',en:'Sensors unavailable'},invalid:{fr:'Mesure indisponible',en:'Reading unavailable'},stale:{fr:'Mesure ancienne',en:'Stale reading'}};
var snapshot=null;
function valid(value){return typeof value==='number'&&Number.isFinite(value)&&value>0&&value<150}
function render(){
 document.documentElement.lang=Fremkit.locale;document.getElementById('heading').textContent=Fremkit.t(L.heading);
 var data=snapshot&&snapshot.thermal,fresh=data&&typeof data.updatedAt==='number'&&Date.now()-data.updatedAt<=30000&&data.updatedAt-Date.now()<=5000&&!snapshot.error&&!data.error;
 ['cpu','gpu'].forEach(function(key){var value=data&&data[key+'Celsius'];document.getElementById(key).textContent=fresh&&valid(value)?new Intl.NumberFormat(Fremkit.locale,{maximumFractionDigits:1}).format(value):'?'});
 var reason=!snapshot?'loading':snapshot.error?'offline':!data?'unconfigured':data.error||(!fresh?'stale':null);
 document.getElementById('status').textContent=reason?Fremkit.t(L[reason]||L.offline):Fremkit.t(L.average,{time:new Date(data.updatedAt).toLocaleTimeString(Fremkit.locale,{hour:'2-digit',minute:'2-digit',second:'2-digit'})});
}
Fremkit.whenReady(function(){Fremkit.subscribe('system',function(data){snapshot=data;render()});Fremkit.onLocale(render);render();setInterval(render,1000)});
</script></body></html>
