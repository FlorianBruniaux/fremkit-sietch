<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codex usage</title><style>html,body{margin:0;height:100%;background:transparent;color:var(--on-surface,var(--text,#e6e8eb));font-family:var(--font,system-ui,sans-serif);overflow:hidden}*{box-sizing:border-box}[hidden]{display:none!important}.wrap{height:100%;padding:16px;display:flex;flex-direction:column;gap:10px}.note,.status,.meta{font-size:calc(13px * var(--text-scale,1));color:var(--text-muted,#8b93a0);line-height:1.4}.status{color:inherit}.note{flex-shrink:0}.list{flex:1;min-height:0;overflow-y:auto;touch-action:pan-y;display:flex;flex-direction:column;gap:8px}.row,.bucket,.metric{background:rgba(128,128,128,.10);border-radius:10px;padding:12px}.row{width:100%;border:0;font:inherit;color:inherit;text-align:left;min-height:56px;display:flex;align-items:center;gap:12px;flex-shrink:0}.row:not(:disabled){cursor:pointer}.row:disabled{opacity:.8}.row:focus-visible{outline:2px solid var(--accent,#d9b36a);outline-offset:-2px}.body{flex:1;min-width:0}.title{display:block;font-size:calc(16px * var(--text-scale,1));font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.action{font-size:calc(13px * var(--text-scale,1));max-width:35%;text-align:right}.section{font-size:calc(14px * var(--text-scale,1));font-weight:600;letter-spacing:.04em;margin:0}.windows{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px}.window{flex:1;min-width:180px}.value{font-size:calc(24px * var(--text-scale,1));font-weight:600;margin:4px 0}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.cwrap{display:none;gap:8px;align-items:center;min-width:0}.cvalue{font-size:calc(var(--h,80px) * .22 * var(--text-scale,1));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.clabel{font-size:calc(var(--h,80px) * .18 * var(--text-scale,1))}html.on-light .note,html.on-light .meta{color:var(--on-surface,#15202b);opacity:.8}html.compact .wrap{padding:0 10px;justify-content:center}html.compact .full{display:none!important}html.compact .cwrap{display:flex}html.compact.slot-right .cwrap{justify-content:flex-end;text-align:right}
.service{display:flex;align-items:center;gap:10px;flex-shrink:0;font-size:calc(19px * var(--text-scale,1));font-weight:650;line-height:1.2}.service-icon{width:30px;height:30px;flex-shrink:0;color:inherit}.cwrap .service-icon{width:24px;height:24px}.note,.status,.meta{font-size:calc(14px * var(--text-scale,1));color:inherit;opacity:.85}.title{font-size:calc(18px * var(--text-scale,1));line-height:1.3;margin-bottom:5px}.history-marker{display:inline-block;border:1px solid currentColor;border-radius:4px;padding:1px 5px;margin-right:6px;font-size:calc(12px * var(--text-scale,1));color:inherit}.source{display:block;margin-top:3px}.status{border-left:3px solid var(--accent,#d9b36a);padding-left:8px;opacity:1}#error{font-weight:600;flex-shrink:0}html.accent-fill .row:focus-visible{outline-color:var(--on-surface,#fff)}
.account{flex-shrink:0;min-width:0}.account-identity{font-size:calc(16px * var(--text-scale,1));font-weight:600;overflow-wrap:anywhere;line-height:1.4;margin-top:4px}
html.compact .cwrap{width:100%;height:100%;gap:10px;text-align:left}html.compact .service-icon{display:block;width:28px;height:28px;flex-shrink:0;color:#45bd9f}.compact-gauges{display:flex;gap:12px;min-width:0;flex:1}.cg{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}.cline{display:flex;justify-content:space-between;gap:6px;font-size:calc(clamp(12px,calc(var(--h,80px) * .26),24px) * var(--text-scale,1));font-weight:600;line-height:1.1;white-space:nowrap}.cline .n{color:var(--text-muted,#8b93a0);font-weight:500;overflow:hidden;text-overflow:ellipsis}.cbar{height:max(2px,calc(var(--h,80px) * .045));border-radius:999px;background:var(--surface-3,#252a32);overflow:hidden}.cbar>i{display:block;height:100%;transition:width .4s}.cbar.ok>i{background:var(--ok,#2fb36b)}.cbar.warn>i{background:#f0a020}.cbar.hot>i{background:var(--danger,#d9463f)}.cstatus{font-size:calc(var(--h,80px) * .26);color:var(--text-muted,#8b93a0)}
html:not(.compact) .wrap{padding:12px;gap:8px}
.full.service{font-size:17px;gap:8px}.full.service .service-icon{width:24px;height:24px;color:#45bd9f}
.full.account .section{font-size:12px}.full.account .account-identity{font-size:14px;margin-top:2px}.full.account .note{font-size:11px}
.full.list .section{font-size:12px}.full.list .status,.full.list .note{font-size:11px}.full.list .meta{font-size:12px}
.full.list .bucket,.full.list .metric{padding:10px}.full.list .windows{gap:8px;margin-top:6px}.full.list .window{min-width:140px}.full.list .value{font-size:20px;line-height:1.25;margin:4px 0}
.full.list .summary{grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px}.full.list .metric{min-height:76px}.full.list .metric .value{font-size:18px}
.full.list .note:empty{display:none}
</style></head><body><div class="wrap"><div class="full service"><svg class="service-icon" viewBox="0 0 32 32" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="26" height="22" rx="6"/><path d="m9 12 5 4-5 4m9 0h5"/></svg><span>Codex</span></div><div class="full account"><div class="section" id="accountHeading"></div><div class="account-identity" id="accountIdentity"></div><div class="note" id="accountStatus" role="status"></div></div><div class="full list"><h2 class="section" id="quotaHeading"></h2><div class="status" id="quotaStatus" role="status"></div><div id="quotas"></div><div class="note" id="quotaEmpty"></div><div class="note" id="more"></div><h2 class="section" id="usageHeading"></h2><div class="status" id="usageStatus" role="status"></div><div class="summary" id="summary"></div><div class="note" id="usageEmpty"></div></div><div class="cwrap"><svg class="service-icon" viewBox="0 0 32 32" role="img" aria-label="Codex" focusable="false" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="26" height="22" rx="6"/><path d="m9 12 5 4-5 4m9 0h5"/></svg><div class="compact-gauges" id="compact" role="status"></div></div></div><script>var L = {"loading": {"fr": "Chargement…", "en": "Loading…"}, "unconfigured": {"fr": "Non configuré", "en": "Not configured"}, "unauthorized": {"fr": "Autorisation du compte requise", "en": "Account authorization required"}, "unsupported": {"fr": "Méthode non prise en charge", "en": "Method unsupported"}, "offline": {"fr": "Hors ligne", "en": "Offline"}, "invalid": {"fr": "Données fournisseur invalides", "en": "Invalid provider data"}, "unknown": {"fr": "Inconnu", "en": "Unknown"}, "stale": {"fr": "Données anciennes", "en": "Stale"}, "updated": {"fr": "Mis à jour", "en": "Updated"}, "history": {"fr": "Historique", "en": "History"}, "unknownContext": {"fr": "Projet : inconnu · Activité live : inconnue", "en": "Project: unknown · Live activity: unknown"}, "empty": {"fr": "Aucun historique enregistré", "en": "No stored history"}, "staleEmpty": {"fr": "Historique vide en cache", "en": "Cached empty history"}, "untitled": {"fr": "Sans titre", "en": "Untitled"}, "unavailable": {"fr": "Ouverture indisponible", "en": "Opening unavailable"}, "open": {"fr": "Ouvrir", "en": "Open"}, "openFailed": {"fr": "Impossible d’ouvrir cette session enregistrée", "en": "Could not open this stored session"}, "more": {"fr": "Plus d’historique disponible", "en": "More history available"}, "shown": {"fr": "Affichage de {n} sur {total}", "en": "Showing {n} of {total}"}, "quotas": {"fr": "Quotas", "en": "Quotas"}, "usage": {"fr": "Usage du compte", "en": "Account usage"}, "noQuota": {"fr": "Quota inconnu", "en": "Quota unknown"}, "remaining": {"fr": "{n}% restant", "en": "{n}% remaining"}, "used": {"fr": "{n}% utilisé", "en": "{n}% used"}, "primary": {"fr": "Fenêtre principale", "en": "Primary window"}, "secondary": {"fr": "Fenêtre secondaire", "en": "Secondary window"}, "reset": {"fr": "Réinitialisation", "en": "Reset"}, "window": {"fr": "Durée", "en": "Duration"}, "lifetimeTokens": {"fr": "Tokens cumulés", "en": "Lifetime tokens"}, "peakDailyTokens": {"fr": "Pic quotidien", "en": "Peak daily tokens"}, "currentStreakDays": {"fr": "Série actuelle", "en": "Current streak"}, "longestStreakDays": {"fr": "Plus longue série", "en": "Longest streak"}, "longestRunningTurnSec": {"fr": "Tour le plus long", "en": "Longest turn"}, "tokens": {"fr": "{n} tokens", "en": "{n} tokens"}, "days": {"fr": "{n} jours", "en": "{n} days"}, "seconds": {"fr": "{n} s", "en": "{n} s"}, "quotaCount": {"fr": "Affichage de {n} sur {total} quotas", "en": "Showing {n} of {total} quota buckets"}};
L.tokensScaled={fr:'{n} de tokens',en:'{n} tokens'};
L.accountHeading={fr:'Compte Codex',en:'Codex account'};
L['apiKey']={fr:'Clé API',en:'API key'};
var snapshot = null;
function t(key,params){return Fremkit.t(L[key] || L.unknown,params)}
function esc(value){return Fremkit.esc(value)}
function date(value, seconds){return value == null ? t('unknown') : new Date(value * (seconds ? 1000 : 1)).toLocaleString(Fremkit.locale === 'fr' ? 'fr-FR' : 'en-GB')}
function status(part){if(!part)return t('loading');var text=[];if(part.freshness==='stale')text.push(t('stale'));if(part.error)text.push(t(part.error));if(part.updatedAt!=null)text.push(t('updated')+': '+date(part.updatedAt,false));return text.join(' · ')}
function set(id,text){document.getElementById(id).textContent=text}
function resize(){document.documentElement.style.setProperty('--h',Fremkit.size.px.height+'px');render()}
function tokens(value){
 var large=value>=1000000, french=Fremkit.locale==='fr';
 var amount=new Intl.NumberFormat(french?'fr-FR':'en-GB',{notation:'compact',compactDisplay:large?'long':'short',maximumFractionDigits:1}).format(value);
 return t(french&&large?'tokensScaled':'tokens',{n:amount});
}
function duration(value,inMinutes){
 if(value==null)return t('unknown');
 if(!inMinutes&&value<60)return Math.floor(value).toLocaleString(Fremkit.locale)+' s';
 var minutes=Math.floor(inMinutes?value:value/60),pieces=[];
 if(inMinutes&&minutes>=1440){var days=Math.floor(minutes/1440);pieces.push(days.toLocaleString(Fremkit.locale)+' '+(Fremkit.locale==='fr'?(days===1?'jour':'jours'):(days===1?'day':'days')));minutes%=1440;}
 if(minutes>=60){pieces.push(Math.floor(minutes/60).toLocaleString(Fremkit.locale)+' h');minutes%=60;}
 if(minutes||!pieces.length)pieces.push(minutes+' min');
 return pieces.join(' ');
}
function windowHtml(value,key){if(!value)return '<div class="window"><div class="meta">'+esc(t(key))+'</div>'+esc(t('unknown'))+'</div>';return '<div class="window"><div class="meta">'+esc(t(key))+'</div><div class="value">'+esc(t('remaining',{n:value.remainingPercent}))+'</div><div class="meta">'+esc(t('used',{n:value.usedPercent}))+' · '+esc(t('window'))+': '+esc(duration(value.windowDurationMins,true))+'<br>'+esc(t('reset'))+': '+esc(date(value.resetsAt,true))+'</div></div>'}
function compactQuotaHtml(quotas,buckets){
 var bucket=buckets.find(function(b){return b.id==='codex'})||buckets[0];
 var windows=bucket?[{value:bucket.primary,key:'primary'},{value:bucket.secondary,key:'secondary'}].filter(function(w){return w.value}):[];
 if(!quotas||quotas.freshness!=='fresh'||quotas.error||!windows.length){var reason=!quotas?t('loading'):quotas.freshness!=='fresh'||quotas.error?status(quotas):t('noQuota');return '<span class="cstatus" title="'+esc(reason)+'" aria-label="'+esc(reason)+'">'+(!quotas?'…':'?')+'</span>'}
 return windows.map(function(w){var v=w.value,p=Math.max(0,Math.min(100,v.usedPercent)),name=v.windowDurationMins==null?t(w.key):duration(v.windowDurationMins,true),label=(bucket.name||'Codex')+' · '+name+' · '+t('used',{n:v.usedPercent}),details=label+' · '+t('remaining',{n:v.remainingPercent})+' · '+t('reset')+': '+date(v.resetsAt,true);return '<div class="cg" role="meter" aria-label="'+esc(label)+'" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+p+'" title="'+esc(details)+'"><div class="cline"><span class="n">'+esc(name)+'</span><span>'+esc(v.usedPercent)+'%</span></div><div class="cbar '+(p<60?'ok':p<85?'warn':'hot')+'"><i style="width:'+p+'%"></i></div></div>'}).join('');
}
function render(){
 document.documentElement.lang=Fremkit.locale;
 var account=snapshot&&snapshot.account,identity=account&&account.data;
 set('accountHeading',t('accountHeading'));
 set('accountStatus',account?status(account):'');
 var accountText=!snapshot?t('loading'):!identity?t(account&&account.error||'unknown'):identity.type==='apiKey'?t('apiKey'):identity.type==='amazonBedrock'?'Amazon Bedrock':(identity.email||t('unknown'))+' · ChatGPT'+(identity.planType?' '+identity.planType.charAt(0).toUpperCase()+identity.planType.slice(1):'');
 set('accountIdentity',accountText);

 var quotas=snapshot&&snapshot.quotas, usage=snapshot&&snapshot.usage, buckets=quotas&&quotas.data&&quotas.data.buckets||[];
 set('quotaHeading',t('quotas'));set('usageHeading',t('usage'));set('quotaStatus',status(quotas));set('usageStatus',status(usage));
 document.getElementById('quotas').innerHTML=buckets.slice(0,6).map(function(bucket){return '<section class="bucket"><div class="section">'+esc(bucket.name||bucket.id)+'</div><div class="windows">'+windowHtml(bucket.primary,'primary')+windowHtml(bucket.secondary,'secondary')+'</div></section>'}).join('');
 set('quotaEmpty',!quotas?t('loading'):!quotas.data?t(quotas.error):buckets.length?'':t('noQuota'));
 set('more',buckets.length>6?t('quotaCount',{n:6,total:buckets.length}):'');
 var summary=usage&&usage.data&&usage.data.summary;
 document.getElementById('summary').innerHTML=summary?['lifetimeTokens','peakDailyTokens','currentStreakDays','longestStreakDays','longestRunningTurnSec'].map(function(key){var value=summary[key];return '<div class="metric"><div class="meta">'+esc(t(key))+'</div><div class="value">'+esc(value==null?t('unknown'):key.indexOf('Tokens')!==-1?tokens(value):key==='longestRunningTurnSec'?duration(value,false):t('days',{n:value.toLocaleString(Fremkit.locale)}))+'</div></div>'}).join(''):'';
 set('usageEmpty',!usage?t('loading'):!summary?t(usage.error):'');
 document.getElementById('compact').innerHTML=compactQuotaHtml(quotas,buckets);
}
Fremkit.whenReady(function(){Fremkit.subscribe('codex',function(data){snapshot=data;render()});Fremkit.onLocale(render);Fremkit.onResize(resize);resize()});
</script></body></html>
