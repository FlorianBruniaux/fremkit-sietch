<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Local AI</title><style>html,body{margin:0;height:100%;background:transparent;color:var(--on-surface,var(--text,#e6e8eb));font-family:var(--font,system-ui,sans-serif)}*{box-sizing:border-box}.wrap{height:100%;padding:18px;display:flex;flex-direction:column;gap:12px}h2,h3{margin:0}h2{display:flex;align-items:center;gap:12px;font-size:calc(24px * var(--text-scale,1))}.service-icon{flex:none;width:32px;height:32px;color:#b595ec}html.on-light .service-icon{color:#7850a5}.subtitle,.meta{font-size:calc(15px * var(--text-scale,1));opacity:.8;line-height:1.5}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px;overflow:auto;min-height:0}.card{padding:16px;border:1px solid var(--border,#464c56);border-radius:12px;min-width:0}.name{font-size:calc(20px * var(--text-scale,1));font-weight:650;overflow-wrap:anywhere}.pill{display:inline-block;border-radius:6px;padding:4px 8px;margin:8px 0;border:1px solid currentColor}.running{color:var(--ok,#2fb36b)}.stopped{opacity:.75}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:calc(17px * var(--text-scale,1))}.list{overflow:auto;min-height:0}.section{margin-bottom:18px}.status{border-left:3px solid var(--accent,#d9b36a);padding-left:8px;line-height:1.5}.columns{display:grid;grid-template-columns:1fr 1fr;gap:18px;overflow:auto;min-height:0}.row{padding:14px 0;border-bottom:1px solid var(--border,#464c56)}html.on-light .meta{opacity:.85}</style></head><body><div class="wrap"><h2><svg class="service-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5a3 3 0 0 0-6 0v1a4 4 0 0 0-3 6 4 4 0 0 0 3 7 3 3 0 0 0 6 0V5Zm0 0a3 3 0 0 1 6 0v1a4 4 0 0 1 3 6 4 4 0 0 1-3 7 3 3 0 0 1-6 0M6 6v3m12-3v3M6 19v-3m12 3v-3"/></svg>Ollama · MLX</h2><div class="subtitle" id="note"></div><div class="columns"><div class="list"><div class="section"><h3 id="loadedTitle"></h3><div class="status" id="loadedStatus"></div><div id="loaded"></div></div><div class="section"><h3 id="installedTitle"></h3><div class="status" id="installedStatus"></div><div id="installed"></div></div></div><div class="list"><h3>MLX / oMLX</h3><div class="status" id="mlxStatus"></div><div id="mlx"></div></div></div></div><script>var L={"loading": {"fr": "Chargement…", "en": "Loading…"}, "stale": {"fr": "Données anciennes", "en": "Stale data"}, "offline": {"fr": "Indisponible", "en": "Unavailable"}, "unknown": {"fr": "Inconnu", "en": "Unknown"}, "remote": {"fr": "Contexte Docker distant : suivi local désactivé", "en": "Remote Docker context: local monitoring disabled"}, "note": {"fr": "Chargé en mémoire ne signifie pas génération en cours. MLX : observation des processus uniquement.", "en": "Loaded into memory does not mean generating. MLX: process observation only."}, "loaded": {"fr": "Ollama · chargés en mémoire", "en": "Ollama · loaded into memory"}, "installed": {"fr": "Ollama · installés", "en": "Ollama · installed"}, "noLoaded": {"fr": "Aucun modèle chargé", "en": "No loaded model"}, "noInstalled": {"fr": "Aucun modèle installé", "en": "No installed model"}, "noMlx": {"fr": "Aucun processus MLX détecté", "en": "No MLX process detected"}, "loadedMemory": {"fr": "Empreinte chargée", "en": "Loaded footprint"}, "gpuMemory": {"fr": "Part GPU déclarée", "en": "Reported GPU allocation"}, "disk": {"fr": "Taille sur disque", "en": "Disk size"}, "context": {"fr": "Contexte", "en": "Context"}};var snapshot=null;function t(k,p){return Fremkit.t(L[k],p)}function esc(v){return Fremkit.esc(v==null?'':v)}function state(p){return !p?t('loading'):(p.stale?t('stale')+' · ':'')+(p.error?t(p.error==='remote-context'?'remote':'offline'):'')}function gb(v){return v==null?t('unknown'):(v/1073741824).toLocaleString(Fremkit.locale,{maximumFractionDigits:1})+' '+(Fremkit.locale==='fr'?'Go':'GB')}
function render(){document.documentElement.lang=Fremkit.locale;document.getElementById('note').textContent=t('note');document.getElementById('loadedTitle').textContent=t('loaded');document.getElementById('installedTitle').textContent=t('installed');
['loaded','installed','mlx'].forEach(function(k){var p=snapshot&&snapshot[k];document.getElementById(k+'Status').textContent=state(p);var rows=p&&p.data;document.getElementById(k).innerHTML=!rows?'':!rows.length?esc(t(k==='mlx'?'noMlx':k==='loaded'?'noLoaded':'noInstalled')):rows.map(function(m){if(k==='mlx')return '<div class="row"><div class="name">'+esc(m.model||t('unknown'))+'</div><div class="meta">'+esc(m.backend)+' · PID '+esc(m.pid)+' · CPU '+esc(m.cpu)+'% · '+gb(m.memoryBytes)+(m.port?' · port '+esc(m.port):'')+'</div></div>';return '<div class="row"><div class="name">'+esc(m.name)+'</div><div class="meta">'+esc(k==='loaded'?t('loadedMemory'):t('disk'))+' '+esc(gb(m.size))+(k==='loaded'&&m.size_vram!=null?' · '+esc(t('gpuMemory'))+' '+esc(gb(m.size_vram)):'')+(k==='loaded'&&m.context_length!=null?' · '+esc(t('context'))+' '+esc(m.context_length.toLocaleString(Fremkit.locale)):'')+'</div></div>'}).join('');});}
Fremkit.whenReady(function(){Fremkit.subscribe('local-models',function(d){snapshot=d;render()});Fremkit.onLocale(render);render()});</script></body></html>
